<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101018">
<title>Смотрим вместе</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest" defer></script>
<style>
  :root{
  --bg:#101018; --surface:#191924; --surface-2:#21212e;
  --border:#2a2a38; --text:#ebeaf2; --text-2:#a8a8b8; --text-3:#6e6e82;
  --accent:#6f52e8; --accent-2:#8b72f0;
  --danger:#e05563; --success:#4a9e6e;
  --radius:12px; --radius-lg:16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --header-h: 56px;
  --dock-h: 64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
  overflow-x:hidden; min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
body.in-room{overflow:hidden;height:100dvh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:16px}
.wrap{max-width:1400px;margin:0 auto;padding:0 12px}
.screen{display:none}
.screen.active{display:block}
  .btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 16px;border-radius:var(--radius);font-size:14px;font-weight:700;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  min-height:46px;text-align:center;transition:transform .1s,opacity .15s;
}
.btn:active{transform:scale(.98);opacity:.9}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.block{width:100%;margin-top:6px}
.btn.small{padding:8px 12px;min-height:36px;font-size:12px}
.btn.big{min-height:56px;font-size:15px;font-weight:800;border-radius:var(--radius-lg)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.input,.select{
  width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:12px 14px;border-radius:var(--radius);font-size:16px;margin-bottom:8px;
}
.input:focus,.select:focus{outline:none;border-color:var(--accent)}
.select{appearance:none;-webkit-appearance:none}
.field-label{
  display:block;font-size:11px;color:var(--text-3);text-transform:uppercase;
  letter-spacing:1px;font-weight:700;margin:12px 0 5px;
}

.toast-root{
  position:fixed;left:0;right:0;bottom:calc(120px + var(--safe-bottom));
  z-index:300;display:flex;flex-direction:column;align-items:center;gap:6px;
  pointer-events:none;padding:0 12px;
}
.toast{
  background:var(--surface-2);color:var(--text);padding:10px 16px;border-radius:20px;
  font-size:13px;font-weight:600;max-width:100%;border:1px solid var(--border);
  animation:toastIn .25s;text-align:center;
}
.toast.error{background:var(--danger);color:#fff}
.toast.success{background:var(--success);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.sheet-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  background:var(--surface);width:100%;max-width:520px;
  border-radius:20px 20px 0 0;border-top:1px solid var(--border);
  padding:16px 16px calc(20px + var(--safe-bottom));
  max-height:90vh;overflow-y:auto;animation:slideUp .25s;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet::before{content:'';display:block;width:44px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.sheet h2{font-size:17px;font-weight:800;margin-bottom:4px}
.sheet .sub{font-size:13px;color:var(--text-2);margin-bottom:14px}

.sheet-list{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.sheet-item{
  display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:12px;
  cursor:pointer;font-size:15px;font-weight:600;min-height:56px;transition:background .1s;
}
.sheet-item:active{background:var(--surface-2)}
.sheet-item .ic{font-size:20px;flex-shrink:0;width:24px;text-align:center}
.sheet-item.danger{color:var(--danger)}
.sheet-item .badge-auto{margin-left:auto;font-size:11px;color:var(--text-3)}
  .room-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;position:relative;
  min-height:110px;transition:transform .1s;
}
.room-card:active{transform:scale(.97)}
.room-card-avatar{
  width:52px;height:52px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:26px;border:2px solid var(--border);
}
.room-card-name{font-size:14px;font-weight:800;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.room-card-badge{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;background:var(--accent);border-radius:8px;padding:2px 7px;color:#fff}

.avatar-option{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);background:var(--surface-2);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.avatar-option.selected{border-color:var(--accent);transform:scale(1.08)}
.color-option{width:38px;height:38px;border-radius:50%;border:2px solid var(--border);cursor:pointer}
.color-option.selected{border-color:var(--text);transform:scale(1.08)}

.hidden-note{font-size:12px;color:var(--text-3);font-style:italic;padding:12px;text-align:center}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty-state .big-icon{font-size:44px;margin-bottom:10px;opacity:.5}
.empty-state h2{font-size:15px;margin-bottom:6px;font-weight:700}
.empty-state p{font-size:12px}
.video-placeholder{color:#888;text-align:center;padding:20px;font-size:13px;line-height:1.5}
.video-placeholder .big{font-size:15px;font-weight:700;margin-bottom:6px;color:#bbb}
  .chat-block{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.chat-title{font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;flex-shrink:0}
.chat-messages{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-right:2px}
.chat-input-row{
  display:flex;gap:6px;flex-shrink:0;padding-top:8px;
  border-top:1px solid var(--border);background:transparent;
}
.chat-input-row .input{flex:1;margin-bottom:0;min-width:0}
.chat-input-row .btn{width:auto;padding:12px 16px;margin:0;min-height:46px;flex-shrink:0}

.chat-msg{padding:8px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.chat-msg:last-child{border-bottom:none}
.chat-msg-avatar{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--surface-2)}
.chat-msg-body{flex:1;min-width:0}
.chat-msg-name{font-size:12px;font-weight:700;margin-bottom:2px}
.chat-msg-text{font-size:14px;word-wrap:break-word}
.chat-msg-time{font-size:10px;color:var(--text-3);margin-top:3px}

.dm-box{display:flex;flex-direction:column;height:55vh;min-height:300px}
.dm-messages{flex:1;overflow-y:auto;padding:10px;background:var(--bg);border-radius:12px;margin-bottom:10px}
.dm-msg{max-width:80%;padding:10px 14px;border-radius:16px;margin-bottom:8px;font-size:15px;word-wrap:break-word}
.dm-msg.mine{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.dm-msg.their{background:var(--surface-2);color:var(--text);margin-right:auto;border-bottom-left-radius:4px}
.dm-time{font-size:10px;opacity:.6;margin-top:4px}

.people-row{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border)}
.people-row:last-child{border-bottom:none}
.people-row-avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.people-row-name{flex:1;font-size:14px;font-weight:700}
.people-row-status{font-size:11px;color:var(--text-3)}
  .video-section{display:flex;flex-direction:column;gap:4px;flex-shrink:0;min-height:0}
.video-label{
  font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;
  align-self:flex-start;
}
.video-label-common{color:var(--text-3);background:var(--surface-2)}
.video-label-personal{color:#fff;background:var(--accent)}

.video-box{
  position:relative;background:#000;border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
}
.video-box iframe,.video-box video{width:100%;height:100%;border:none}
.video-box-personal{border-color:var(--accent);border-width:2px}

.countdown-overlay{
  display:none;position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.75);
  align-items:center;justify-content:center;flex-direction:column;gap:8px;
  pointer-events:none;
}
.countdown-num{font-size:80px;font-weight:900;color:#fff;line-height:1}
.countdown-hint{font-size:13px;color:#ccc}
.play-overlay{
  display:none;position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.6);
  align-items:center;justify-content:center;flex-direction:column;gap:8px;
  pointer-events:none;
}
.play-overlay .text{font-size:20px;font-weight:800;color:#fff}
.play-overlay .hint{font-size:12px;color:#ccc}
  .app-header{
  position:sticky;top:0;z-index:50;
  background:rgba(16,16,24,.95);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.app-header .wrap{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px;max-width:1400px;
}
.logo{font-size:18px;font-weight:800;cursor:pointer}

#screen-home{padding:16px 12px 200px;max-width:1400px;margin:0 auto}
.greeting{padding:16px 0 4px;font-size:22px;font-weight:800;letter-spacing:-.4px}
.greeting-sub{padding:0 0 12px;font-size:13px;color:var(--text-2)}
.rooms-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

@media (min-width: 701px){
  #screen-home{padding:24px 24px 120px}
  .greeting{padding:24px 0 6px;font-size:28px;letter-spacing:-.6px}
  .greeting-sub{padding:0 0 20px;font-size:15px}
  .rooms-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
}

.bottom-panel{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  max-width:1400px;margin:0 auto;
  padding:10px 12px calc(10px + var(--safe-bottom));
  background:rgba(16,16,24,.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:8px;
}
@media (min-width: 701px){
  .bottom-panel{padding:12px 24px calc(12px + var(--safe-bottom));flex-direction:row;align-items:center}
  .bottom-panel .btn{min-width:280px}
}
  @media (orientation: portrait){

  /* Фиксированный контейнер комнаты */
  body.in-room #screen-room{
    position:fixed;
    top:var(--header-h);left:0;right:0;
    bottom:calc(var(--dock-h) + var(--safe-bottom));
    display:flex;flex-direction:column;
    overflow:hidden;
    padding:0 12px;
    background:var(--bg);
    z-index:1;
  }

  .room-header{flex-shrink:0;padding:8px 0;background:var(--bg)}
  .room-header-top{display:flex;align-items:center;gap:8px}
  .back-btn{
    width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
    font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-2);
  }
  .room-info{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
  .room-info-avatar{
    width:40px;height:40px;border-radius:50%;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
  }
  .room-info-text{flex:1;min-width:0;overflow:hidden}
  .room-info-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .room-info-meta{font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Один layout: плеер + чат */
  .room-layout{
    display:flex;flex-direction:column;
    flex:1;min-height:0;
    gap:8px;
  }
  .room-left{
    display:flex;flex-direction:column;gap:8px;
    flex-shrink:0;
  }
  .room-right{
    flex:1;min-height:0;
    display:flex;flex-direction:column;
  }

  /* В портрете личное видео скрываем — мало места */
  .video-section-personal{display:none}

  /* Плеер фикс по высоте */
  .video-section-common{flex-shrink:0;margin-bottom:0}

  /* Чат скроллится */
  .chat-block{flex:1;min-height:0;margin-bottom:8px}

  /* Док — снизу, одна рука */
  .room-bottom-panel{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    max-width:520px;margin:0 auto;
    padding:8px 12px calc(8px + var(--safe-bottom));
    background:rgba(16,16,24,.96);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--border);
    display:flex;gap:6px;align-items:center;
    min-height:var(--dock-h);box-sizing:border-box;
  }
  .room-bottom-panel .input{margin-bottom:0;flex:1;min-width:0}

  .icon-btn{
    width:46px;height:46px;border-radius:12px;background:var(--surface-2);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;position:relative;transition:transform .1s;
  }
  .icon-btn:active{transform:scale(.94)}
  .icon-btn .badge{
    position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;
    font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
  }

  /* В портрете input в чате, док — только иконки */
  .room-bottom-panel .input{display:none}
    }
  @media (orientation: landscape){

  body.in-room #screen-room{
    position:fixed;
    top:var(--header-h);left:0;right:0;
    bottom:calc(var(--dock-h) + var(--safe-bottom));
    overflow:hidden;z-index:1;
    padding:0 20px;
  }

  /* Grid: плеер слева, чат справа */
  .room-layout{
    display:grid;grid-template-columns:1.5fr 1fr;gap:16px;
    max-width:1400px;margin:0 auto;height:100%;box-sizing:border-box;
    padding-top:12px;
  }
  .room-left{
    display:flex;flex-direction:column;gap:8px;
    min-height:0;overflow-y:auto;padding-right:4px;
  }
  .room-right{
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
  }

  .room-header{display:flex;flex-direction:column;gap:10px;flex-shrink:0}
  .room-header-top{display:flex;align-items:center;gap:12px}
  .back-btn{
    width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
    font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-2);
  }
  .room-info{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
  .room-info-avatar{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .room-info-name{font-size:17px;font-weight:700}
  .room-info-meta{font-size:12px;color:var(--text-2)}

  .video-box{border-radius:var(--radius-lg)}
  .chat-block{flex:1;min-height:0;padding:14px;border-radius:var(--radius-lg)}
  .chat-title{font-size:12px;margin-bottom:10px}
  .chat-messages{padding-right:4px;margin-bottom:10px}
  .chat-input-row{padding:10px 0 0;border-top:1px solid var(--border)}

  /* Док — две зоны для двух рук */
  .room-bottom-panel{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    height:var(--dock-h);
    padding:8px 24px calc(8px + var(--safe-bottom));
    background:rgba(16,16,24,.96);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--border);
    box-sizing:border-box;
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
  }
  .dock-left{display:flex;gap:8px;align-items:center;justify-content:flex-start}
  .dock-right{display:flex;gap:8px;align-items:center;justify-content:flex-end}
  .tab-btn{
    height:46px;min-width:110px;padding:0 16px;border-radius:12px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    font-size:13px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    cursor:pointer;transition:transform .1s;position:relative;flex-shrink:0;
  }
  .tab-btn:active{transform:scale(.96)}
  .tab-btn.has-personal{border-color:var(--accent);background:rgba(111,82,232,.15)}
  .tab-btn .badge{
    position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;
    font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
  }
  }
  /* ПК: широкое окно, мышь — кнопки по центру, крупнее */
@media (orientation: landscape) and (min-width: 1024px) and (hover: hover) and (pointer: fine){

  body.in-room #screen-room{
    padding:0 32px;
  }
  .room-layout{
    grid-template-columns:1.4fr 1fr;
    gap:24px;
    max-width:1600px;
    padding-top:20px;
  }
  .video-box{border-radius:var(--radius-lg)}
  .chat-block{padding:18px}

  /* Док: убрать две зоны, всё по центру */
  .room-bottom-panel{
    height:auto;
    min-height:72px;
    padding:14px 32px calc(14px + var(--safe-bottom));
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    box-sizing:border-box;
  }
  .dock-left,
  .dock-right{display:contents}

  .tab-btn{
    height:52px;
    min-width:150px;
    padding:0 24px;
    font-size:15px;
    gap:8px;
  }
  .tab-btn:hover{background:var(--surface);border-color:var(--text-3)}
  .tab-btn:active{transform:scale(.97)}

  /* Кнопки действий — крупнее */
  .btn.big{min-height:60px;font-size:16px}
  .chat-input-row .btn{min-height:52px;padding:12px 24px;font-size:15px}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="wrap">
    <div class="logo" onclick="goHome()">Смотрим вместе</div>
  </div>
</header>

<main class="wrap">
  <section id="screen-home" class="screen active">
    <div class="greeting" id="greeting">Добрый вечер</div>
    <div class="greeting-sub">Найди комнату или создай свою</div>
    <div id="roomsArea" class="rooms-grid"></div>
    <div id="emptyState" class="empty-state" style="display:none">
      <div class="big-icon">🎬</div>
      <h2>Пока нет комнат</h2>
      <p>Создай первую — например, «Кино на вечер»</p>
    </div>
  </section>

  <section id="screen-room" class="screen">
    <div id="roomContent"></div>
  </section>
</main>

<div class="bottom-panel" id="homeBottomPanel">
  <button class="btn primary big block" onclick="openCreateRoom()">➕ Создать комнату</button>
</div>

<div id="roomBottomPanel" class="room-bottom-panel" style="display:none"></div>
<div id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

async function generateRoomName(base){
  const b = base.trim(); if(!b) return '';
  try {
    const {data} = await sb.from('rooms').select('name').ilike('name', b + '%');
    if(!data || data.length === 0) return b;
    let max = 0;
    data.forEach(r => {
      if(r.name === b) max = Math.max(max, 1);
      else { const m = r.name.match(new RegExp('^' + b.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ' (\\d+)$')); if(m) max = Math.max(max, parseInt(m[1])); }
    });
    return max === 0 ? b : b + ' ' + (max + 1);
  } catch(e){ return b; }
}

async function enterRoom(roomId){
  let room = rooms.find(r => r.id === roomId);
  if(!room){
    const {data, error} = await sb.from('rooms').select('*').eq('id', roomId).limit(1);
    if(error || !data || data.length === 0) return toast('Комната не найдена', 'error');
    room = data[0];
    if(!rooms.find(r => r.id === roomId)) rooms.push(room);
  }
  if(room.expires_at && new Date(room.expires_at) < new Date()) return toast('Комната удалена', 'error');
  if(room.is_hidden && room.host_id !== myId){
    const urlInvite = new URLSearchParams(location.search).get('invite');
    const savedInvite = sessionStorage.getItem('room_invite_' + roomId);
    if(urlInvite !== room.invite_code && savedInvite !== room.invite_code) return toast('Скрытая комната. Нужна ссылка от хоста.', 'error');
    sessionStorage.setItem('room_invite_' + roomId, room.invite_code);
  }
  if(room.password_hash && room.host_id !== myId){
    const savedPass = sessionStorage.getItem('room_pass_' + roomId);
    if(savedPass !== room.password_hash){
      const entered = prompt('Комната с паролем. Введи пароль:');
      if(!entered) return;
      const hash = encodePass(entered);
      if(hash !== room.password_hash) return toast('Неверный пароль', 'error');
      sessionStorage.setItem('room_pass_' + roomId, hash);
    }
  }
  await teardownChannels();
  currentRoom = room;
  isHost = (room.host_id === myId);
  localStorage.setItem(LS.lastRoom, roomId);
  showScreen('room');
  renderRoomShell();
  await loadRoomMessages(roomId);

    const d = Math.ceil((new Date(room.countdown_start).getTime() - Date.now()) / 1000);
    if(d > 0) startCountdown();
  }
  maybeStartAutoSwitch();
}

  function parseVideoUrl(url){
  if(!url) return null;
  url = url.trim();
  if(!url.match(/^https?:\/\//i)) return null;
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(yt) return {type:'invidious', videoId:yt[1], src:currentInvidious + '/embed/' + yt[1], embeddable:true};
  const rt = url.match(/rutube\.ru\/(?:video|play\/embed|live)\/([a-zA-Z0-9]+)/);
  if(rt) return {type:'iframe', src:'https://rutube.ru/play/embed/' + rt[1], embeddable:true};
  const vk = url.match(/(?:vk\.com|vkvideo\.ru)\/video(-?\d+)_(\d+)/);
  if(vk) return {type:'iframe', src:'https://vk.com/video_ext.php?oid=' + vk[1] + '&id=' + vk[2] + '&autoplay=0', embeddable:true};
  const tw = url.match(/twitch\.tv\/([a-zA-Z0-9_]+)$/);
  if(tw) return {type:'iframe', src:'https://player.twitch.tv/?channel=' + tw[1] + '&parent=' + location.hostname, embeddable:true};
  if(url.match(/\.(mp4|webm|ogg|mov|m4v)(\?|$)/i)) return {type:'html5', src:url, embeddable:true};
  if(url.match(/\.m3u8(\?|$)/i)) return {type:'hls', src:url, embeddable:true};
  return {type:'iframe', src:url, embeddable:false};
}

async function saveVideo(){

  if(!parseVideoUrl(url)) return toast('Не получилось распознать', 'error');
  const cs = new Date(); cs.setSeconds(cs.getSeconds() + 15);
  const {error} = await sb.from('rooms').update({video_url: url, sync_state: {}, host_id: myId, countdown_start: cs.toISOString()}).eq('id', currentRoom.id);
  if(error){ toast('Ошибка: ' + error.message, 'error'); return; }

function initHtml5Sync(){
  const v = document.getElementById('videoPlayer'); if(!v) return;
  v.addEventListener('play', () => { if(!manualServerChoice) updateSync({playing:true, time:v.currentTime}); });
  v.addEventListener('pause', () => updateSync({playing:false, time:v.currentTime}));
  v.addEventListener('seeked', () => updateSync({playing:!v.paused, time:v.currentTime, seek:true}));
}

function initHls(){
  const v = document.getElementById('videoPlayer'); if(!v || !currentRoom) return;
  if(window.Hls && window.Hls.isSupported()){ const h = new window.Hls(); h.loadSource(currentRoom.video_url); h.attachMedia(v); }
  else if(v.canPlayType('application/vnd.apple.mpegurl')) v.src = currentRoom.video_url;
}

async function updateSync(d){

  const s = Object.assign({}, currentRoom.sync_state || {}, d); s.updated = Date.now();

}

function startCountdown(){
  if(countdownInterval) clearInterval(countdownInterval);
  const o = document.getElementById('countdownOverlay'), n = document.getElementById('countdownNum');
  if(!o || !n) return;
  countdownInterval = setInterval(() => {
    const d = Math.ceil((new Date(currentRoom.countdown_start).getTime() - Date.now()) / 1000);
    if(d > 0){ n.textContent = d; o.style.display = 'flex'; }
    else { o.style.display = 'none'; clearInterval(countdownInterval); countdownInterval = null; showPlayOverlay(); }
  }, 100);
}

async function checkInvidious(url){
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 2500);
    const r = await fetch(url + '/api/v1/stats', {signal: ctrl.signal}); clearTimeout(t);
    if(!r.ok) return false; const data = await r.json();
    return data && (data.version || data.software);
  } catch(e){ return false; }
}

async function findWorkingInvidious(){
  const saved = localStorage.getItem(LS.invidious);
  if(saved && await checkInvidious(saved)){ currentInvidious = saved; return saved; }
  for(const url of INVIDIOUS_INSTANCES){ if(await checkInvidious(url)){ currentInvidious = url; localStorage.setItem(LS.invidious, url); return url; } }
  return null;
}

function maybeStartAutoSwitch(){
  if(autoSwitchDone || manualServerChoice) return;
  if(!currentRoom || !currentRoom.video_url) return;
  const vd = parseVideoUrl(currentRoom.video_url);
  if(!vd || vd.type !== 'invidious') return;
  setTimeout(async () => {
    if(!currentRoom || manualServerChoice || autoSwitchDone) return;
    const frame = document.getElementById('videoPlayer');
    if(!frame || frame.tagName !== 'IFRAME') return;
    if(autoSwitchAttempts >= 3){ autoSwitchDone = true; switchToYouTubeFallback(); return; }
    autoSwitchAttempts++;
    const idx = INVIDIOUS_INSTANCES.indexOf(currentInvidious);
    const next = INVIDIOUS_INSTANCES[(idx + 1) % INVIDIOUS_INSTANCES.length];
    if(await checkInvidious(next)){
      currentInvidious = next; localStorage.setItem(LS.invidious, next);
      toast('Переключаю сервер: ' + new URL(next).hostname);
      renderVideoOnly(); maybeStartAutoSwitch();
    } else { maybeStartAutoSwitch(); }
  }, 10000);
}

function switchToYouTubeFallback(){
  if(!currentRoom || !currentRoom.video_url) return;
  const yt = currentRoom.video_url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(!yt) return;
  const box = document.getElementById('videoBox');
  if(box){
    box.innerHTML = '<iframe id="videoPlayer" src="https://www.youtube.com/embed/' + yt[1] + '?autoplay=0" allow="encrypted-media; fullscreen" allowfullscreen></iframe>' +
      '<div id="countdownOverlay" class="countdown-overlay"><div class="countdown-num" id="countdownNum"></div><div class="countdown-hint">Приготовься смотреть</div></div>' +
      '<div id="playOverlay" class="play-overlay"><div class="text">Нажми Play</div><div class="hint">Видео начнётся у всех</div></div>';
    toast('Invidious недоступен — включён YouTube');
  }
}

function personalVideoKey(){ return currentRoom ? 'smotrim_personal_video_' + currentRoom.id : null; }
function getPersonalVideo(){ const k = personalVideoKey(); return k ? localStorage.getItem(k) : null; }
function setPersonalVideo(url){ const k = personalVideoKey(); if(!k) return; if(url) localStorage.setItem(k, url); else localStorage.removeItem(k); }

function openPersonalVideoSheet(){
  if(!currentRoom) return;
  const url = getPersonalVideo() || '';
  openSheet(
    '<h2>🫈 Своё видео</h2><p class="sub">Это видео видят только вы.</p>' +
    '<label class="field-label">Ссылка</label><input id="personalVideoUrl" class="input" placeholder="https://..." value="' + esc(url) + '">' +
    '<button class="btn primary block" onclick="savePersonalVideo()">Сохранить</button>' +
    (url ? '<button class="btn danger block" onclick="removePersonalVideo()">Убрать</button>' : '') +
    '<button class="btn ghost block" onclick="closeSheet()">Отмена</button>'
  );
  setTimeout(() => { const i = document.getElementById('personalVideoUrl'); if(i) i.focus(); }, 150);
}

function savePersonalVideo(){
  const url = document.getElementById('personalVideoUrl').value.trim();
  if(!url) return toast('Вставь ссылку', 'error');
  if(!parseVideoUrl(url)) return toast('Не получилось распознать', 'error');
  setPersonalVideo(url); closeSheet(); renderPersonalVideo(); refreshDock();
  toast('Своё видео сохранено', 'success');
}

function removePersonalVideo(){
  setPersonalVideo(null); closeSheet(); renderPersonalVideo(); refreshDock();
  toast('Своё видео убрано');
}

function renderPersonalVideo(){
  const box = document.getElementById('personalVideoBox'); if(!box) return;
  const url = getPersonalVideo();
  if(!url){ box.innerHTML = '<div class="video-placeholder" style="padding:16px;font-size:12px">Нажми «Своё» внизу, чтобы добавить видео для себя</div>'; return; }
  const vd = parseVideoUrl(url);
  if(!vd){ box.innerHTML = '<div class="video-placeholder">Не удалось распознать</div>'; return; }
  let vh = '';
  if(vd.type === 'invidious') vh = '<iframe src="' + esc(vd.src) + '" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
  else if(vd.type === 'html5') vh = '<video src="' + esc(vd.src) + '" controls></video>';
  else if(vd.type === 'hls'){
    vh = '<video id="personalHlsPlayer" controls></video>';
    requestAnimationFrame(() => {
      const v = document.getElementById('personalHlsPlayer'); if(!v) return;
      if(window.Hls && window.Hls.isSupported()){ const h = new window.Hls(); h.loadSource(url); h.attachMedia(v); }
      else if(v.canPlayType('application/vnd.apple.mpegurl')) v.src = url;
    });
  }
  else if(vd.embeddable) vh = '<iframe src="' + esc(vd.src) + '" allow="encrypted-media; fullscreen" allowfullscreen></iframe>';
  else vh = '<a href="' + esc(url) + '" target="_blank" rel="noopener" class="btn primary" style="text-decoration:none">Открыть</a>';
  box.innerHTML = vh;
  }
  function renderRoomShell(){
  const r = currentRoom; if(!r) return;
  const days = getDaysLeft(r.expires_at);
  const metaExtra = (r.password_hash ? ' · 🔒' : '') + (r.is_hidden ? ' · скрытая' : '');
  const onlineCount = countOnline();

  const header =
    '<div class="room-header"><div class="room-header-top">' +
      '<button class="back-btn" onclick="leaveRoom()">←</button>' +
      '<div class="room-info">' +
        '<div class="room-info-avatar" style="background:' + esc(r.color || '#6f52e8') + '">' + (r.avatar || '🎬') + '</div>' +
        '<div class="room-info-text">' +
          '<div class="room-info-name">' + esc(r.name) + '</div>' +
          '<div class="room-info-meta" id="roomMeta">' + (isHost ? 'Хост' : 'Гость') + (days !== null ? ' · ' + days + ' дн.' : '') + ' · 🟢 ' + onlineCount + ' онлайн' + metaExtra + '</div>' +
        '</div>' +
      '</div>' +
    '</div></div>';

  const commonVideo = videoSectionHtml(false);
  const personalVideo = videoSectionHtml(true);

  const chatBlock =
    '<div class="chat-block">' +
      '<div class="chat-title">💬 Чат</div>' +
      '<div class="chat-messages" id="chatMessages"></div>' +
      '<div class="chat-input-row">' +
        '<input id="chatInput" class="input" placeholder="Сообщение..." maxlength="500">' +
        '<button class="btn primary" onclick="sendMessage()">Отправить</button>' +
      '</div>' +
    '</div>';

  // Один и тот же layout для всех — CSS сам решит, как расположить
  const layout =
    header +
    '<div class="room-layout">' +
      '<div class="room-left">' + commonVideo + personalVideo + '</div>' +
      '<div class="room-right">' + chatBlock + '</div>' +
    '</div>';

  document.getElementById('roomContent').innerHTML = layout;

  const panel = document.getElementById('roomBottomPanel');
  panel.innerHTML = buildDock();
  panel.className = 'room-bottom-panel';

  renderVideoOnly();
  renderPersonalVideo();
  renderMessages();

  setTimeout(() => {
    const i = document.getElementById('chatInput');
    if(i){
      i.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); sendMessage(); }
      });
    }
  }, 100);
}

// Универсальный док: разный HTML для портрета/ландшафта
function buildDock(){
  const hasPersonal = !!getPersonalVideo();
  // Портрет — только иконки внизу, input в чате
  if(isPortrait()){
    return '' +
      '<button class="icon-btn" onclick="openVideoSheet()" title="Видео">📎</button>' +
      '<button class="icon-btn" onclick="openPeopleSheet()" title="Люди">👥<span id="dmBadge"></span></button>' +
      '<button class="icon-btn" onclick="openActionsSheet()" title="Ещё">⋯</button>';
  }
  // Ландшафт — две зоны для двух рук
  return '' +
    '<div class="dock-left">' +
      '<button class="tab-btn" onclick="openVideoSheet()">📎 Общее</button>' +
      '<button class="tab-btn' + (hasPersonal ? ' has-personal' : '') + '" onclick="openPersonalVideoSheet()">🫈 Своё</button>' +
    '</div>' +
    '<div class="dock-right">' +
      '<button class="tab-btn" onclick="openPeopleSheet()">👥 Люди<span id="dmBadge"></span></button>' +
      '<button class="tab-btn" onclick="openActionsSheet()">⋯ Ещё</button>' +
    '</div>';
}

function refreshDock(){
  const panel = document.getElementById('roomBottomPanel');
  if(!panel || !currentRoom) return;
  panel.innerHTML = buildDock();
  updateDMBadge();
}

function renderRoomHeaderMeta(){
  const r = currentRoom; if(!r) return;
  const el = document.getElementById('roomMeta'); if(!el) return;
  const days = getDaysLeft(r.expires_at);
  const metaExtra = (r.password_hash ? ' · 🔒' : '') + (r.is_hidden ? ' · скрытая' : '');
  el.textContent = (isHost ? 'Хост' : 'Гость') + (days !== null ? ' · ' + days + ' дн.' : '') + ' · 🟢 ' + countOnline() + ' онлайн' + metaExtra;
}

function subscribeToRoom(roomId){
  roomChannel = sb.channel('room-' + roomId)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'room_messages', filter:'room_id=eq.' + roomId}, p => appendMessage(p.new))
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'room_messages', filter:'room_id=eq.' + roomId}, () => loadRoomMessages(roomId))
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'rooms', filter:'id=eq.' + roomId}, p => {
      if(!currentRoom || currentRoom.id !== roomId) return;
      const oldVideo = currentRoom.video_url, oldCountdown = currentRoom.countdown_start;
      currentRoom = p.new;
      if(oldVideo !== p.new.video_url){
        renderVideoOnly(); renderRoomHeaderMeta();
        autoSwitchDone = false; manualServerChoice = false; autoSwitchAttempts = 0;
        maybeStartAutoSwitch();
      }
      if(oldCountdown !== p.new.countdown_start && p.new.countdown_start) startCountdown();
    })
    .on('postgres_changes', {event:'DELETE', schema:'public', table:'rooms', filter:'id=eq.' + roomId}, () => { toast('Комната удалена', 'error'); leaveRoom(); })
    .subscribe();

  dmChannel = sb.channel('dm-' + myId)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'direct_messages', filter:'to_user_id=eq.' + myId}, p => {
      if(p.new.room_id !== currentRoom?.id) return;
      toast('Сообщение от ' + (p.new.from_name || 'гостя'), 'success');
      updateDMBadge();
      const dmPeer = document.getElementById('dmPeerId');
      if(dmPeer && dmPeer.value === p.new.from_user_id) openDM(p.new.from_user_id, p.new.from_name);
    })
    .subscribe();

  presenceChannel = sb.channel('presence-' + roomId)
    .on('postgres_changes', {event:'*', schema:'public', table:'room_presence', filter:'room_id=eq.' + roomId}, () => scheduleLoadPresence())
    .subscribe();
}

function scheduleLoadPresence(){
  if(presenceTimer) return;
  presenceTimer = setTimeout(() => { presenceTimer = null; loadPresence().then(renderRoomHeaderMeta); }, 800);
}

async function loadRoomMessages(roomId){
  const {data, error} = await sb.from('room_messages')
    .select('*').eq('room_id', roomId).eq('hidden', false)
    .order('created_at', {ascending:true}).limit(200);
  if(error){ console.error(error); return; }
  currentRoomMessages = data || [];
  renderMessages();
}

function renderMessages(){
  const box = document.getElementById('chatMessages'); if(!box) return;
  if(currentRoomMessages.length === 0){ box.innerHTML = '<div class="hidden-note">Пока тихо. Напиши первым</div>'; return; }
  box.innerHTML = currentRoomMessages.map(messageHtml).join('');
  box.scrollTop = box.scrollHeight;
}

function messageHtml(m){
  const time = new Date(m.created_at).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  return '<div class="chat-msg" data-id="' + m.id + '" data-user="' + esc(m.user_id) + '" data-name="' + esc(m.name) + '" ' +
    'oncontextmenu="openMsgActions(this);return false" ' +
    'ontouchstart="startMsgTouch(event,this)" ontouchend="endMsgTouch(event,this)">' +
    '<div class="chat-msg-avatar">' + (m.avatar || '👤') + '</div>' +
    '<div class="chat-msg-body"><div class="chat-msg-name">' + esc(m.name) + '</div>' +
    '<div class="chat-msg-text">' + esc(m.text) + '</div>' +
    '<div class="chat-msg-time">' + time + '</div></div></div>';
}

function appendMessage(m){
  if(currentRoomMessages.some(x => x.id === m.id)) return;
  const box = document.getElementById('chatMessages'); if(!box) return;
  const wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  currentRoomMessages.push(m);
  if(currentRoomMessages.length === 1) box.innerHTML = '';
  box.insertAdjacentHTML('beforeend', messageHtml(m));
  if(wasAtBottom) box.scrollTop = box.scrollHeight;
}

async function sendMessage(){
  const inp = document.getElementById('chatInput'); if(!inp) return;
  const text = inp.value.trim(); if(!text) return;
  let name = localStorage.getItem(LS.myName), avatar = localStorage.getItem(LS.myAvatar);
  if(!name){
    name = prompt('Как тебя зовут?'); if(!name) return;
    name = name.trim().slice(0,20);
    avatar = prompt('Аватар (эмодзи)?', '👤') || '👤';
    localStorage.setItem(LS.myName, name); localStorage.setItem(LS.myAvatar, avatar.slice(0,4));
  }
  inp.value = '';
  const {error} = await sb.from('room_messages').insert({room_id: currentRoom.id, name, avatar, text, user_id: myId, hidden: false});
  if(error) toast('Ошибка: ' + error.message, 'error');
}

async function hideMessage(id){
  try {
    await sb.from('message_hides').insert({message_id: id, user_id: myId});
    const {data} = await sb.from('message_hides').select('*').eq('message_id', id);
    if((data || []).length >= 3){ await sb.from('room_messages').update({hidden: true}).eq('id', id); toast('Скрыто у всех', 'success'); }
    else toast('Скрыто у тебя (' + (data || []).length + '/3)');
  } catch(e){ toast('Ошибка: ' + e.message, 'error'); }
}

let msgTouchTimer = null, msgTouchStartX = 0;
function startMsgTouch(e, el){
  msgTouchStartX = e.touches[0].clientX;
  msgTouchTimer = setTimeout(() => { msgTouchTimer = null; openMsgActions(el); }, 500);
}
function endMsgTouch(e, el){
  if(msgTouchTimer){ clearTimeout(msgTouchTimer); msgTouchTimer = null; }
  if(!e.changedTouches) return;
  const dx = e.changedTouches[0].clientX - msgTouchStartX;
  if(dx < -40) openMsgActions(el);
}

function openMsgActions(el){
  const id = el.dataset.id, userId = el.dataset.user, name = el.dataset.name;
  if(!userId) return;
  const isMine = userId === myId;
  openSheet(
    '<h2>Сообщение</h2><div class="sheet-list">' +
    (isMine ? '' : '<div class="sheet-item" data-action="dm" data-user="' + esc(userId) + '" data-name="' + esc(name) + '"><span class="ic">✉️</span> Написать личное</div>') +
    (isMine ? '' : '<div class="sheet-item danger" data-action="hide" data-id="' + id + '"><span class="ic">🙈</span> Скрыть (3 голоса — у всех)</div>') +
    '<div class="sheet-item" onclick="closeSheet()"><span class="ic">✖️</span> Отмена</div></div>'
  );
  setTimeout(() => {
    document.querySelectorAll('#modalRoot .sheet-item[data-action]').forEach(item => {
      item.addEventListener('click', () => {
        const action = item.dataset.action;
        closeSheet();
        if(action === 'dm') openDM(item.dataset.user, item.dataset.name);
        if(action === 'hide') hideMessage(parseInt(item.dataset.id));
      });
    });
  }, 30);
}

async function loadPresence(){
  if(!currentRoom) return;
  const {data} = await sb.from('room_presence').select('*').eq('room_id', currentRoom.id);
  currentPresence = data || [];
}

async function upsertPresence(){
  if(!currentRoom) return;
  await sb.from('room_presence').upsert({
    room_id: currentRoom.id, user_id: myId,
    name: localStorage.getItem(LS.myName) || 'Гость',
    status: 'active', updated_at: new Date().toISOString()
  });
}

function openPeopleSheet(){
  if(!currentRoom) return;
  const online = currentPresence.filter(p => Date.now() - new Date(p.updated_at || 0).getTime() < 120000);
  const offline = currentPresence.filter(p => Date.now() - new Date(p.updated_at || 0).getTime() >= 120000);
  const render = (p, isOnline) =>
    '<div class="people-row"><div class="people-row-avatar">' + (p.user_id === myId ? '🧑' : '👤') + '</div>' +
    '<div style="flex:1;min-width:0"><div class="people-row-name">' + esc(p.name || 'Гость') + (p.user_id === myId ? ' (ты)' : '') + '</div>' +
    '<div class="people-row-status">' + (isOnline ? '🟢 в сети' : '⚪ отошёл') + '</div></div>' +
    (p.user_id !== myId ? '<button class="btn small" data-action="dm" data-user="' + esc(p.user_id) + '" data-name="' + esc(p.name || 'Гость') + '">Написать</button>' : '') + '</div>';
  openSheet(
    '<h2>👥 В комнате (' + online.length + ')</h2>' +
    '<div style="max-height:60vh;overflow-y:auto;margin:12px -16px">' +
    online.map(p => render(p, true)).join('') +
    (offline.length ? '<div class="hidden-note">Отошли</div>' + offline.map(p => render(p, false)).join('') : '') +
    (currentPresence.length === 0 ? '<div class="hidden-note">Пока никого</div>' : '') +
    '</div><button class="btn ghost block" onclick="closeSheet()">Закрыть</button>'
  );
  setTimeout(() => {
    document.querySelectorAll('#modalRoot [data-action="dm"]').forEach(btn => {
      btn.addEventListener('click', () => { closeSheet(); openDM(btn.dataset.user, btn.dataset.name); });
    });
  }, 30);
}

async function openDM(userId, userName){
  if(userId === myId) return toast('Это ты');
  await sb.from('dm_reads').upsert({room_id: currentRoom.id, user_id: myId, peer_id: userId, last_read_at: new Date().toISOString()});
  const {data} = await sb.from('direct_messages').select('*').eq('room_id', currentRoom.id)
    .or('and(from_user_id.eq.' + myId + ',to_user_id.eq.' + userId + '),and(from_user_id.eq.' + userId + ',to_user_id.eq.' + myId + ')')
    .order('created_at', {ascending:true});
  const html = (data || []).map(m => {
    const mine = m.from_user_id === myId;
    return '<div class="dm-msg ' + (mine ? 'mine' : 'their') + '">' + esc(m.text) + '<div class="dm-time">' + new Date(m.created_at).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) + '</div></div>';
  }).join('');
  openSheet(
    '<h2>Личные с ' + esc(userName) + '</h2>' +
    '<input type="hidden" id="dmPeerId" value="' + esc(userId) + '">' +
    '<div class="dm-box"><div class="dm-messages" id="dmMessages">' + (html || '<div class="hidden-note">Начни переписку</div>') + '</div>' +
    '<div class="chat-input-row"><input id="dmInput" class="input" placeholder="Сообщение..." maxlength="500">' +
    '<button class="btn primary" onclick="sendDM(\'' + esc(userId) + '\',\'' + esc(userName) + '\')">Отправить</button></div></div>' +
    '<button class="btn ghost block" onclick="closeSheet()">Закрыть</button>'
  );
  setTimeout(() => {
    const b = document.getElementById('dmMessages'); if(b) b.scrollTop = b.scrollHeight;
    const i = document.getElementById('dmInput');
    if(i) i.addEventListener('keydown', e => { if(e.key === 'Enter') sendDM(userId, userName); });
  }, 100);
  updateDMBadge();
}

async function sendDM(userId, userName){
  const inp = document.getElementById('dmInput'); if(!inp) return;
  const text = inp.value.trim(); if(!text) return;
  inp.value = '';
  await sb.from('direct_messages').insert({room_id: currentRoom.id, from_user_id: myId, to_user_id: userId, from_name: localStorage.getItem(LS.myName) || 'Гость', to_name: userName, text});
  openDM(userId, userName);
}

async function updateDMBadge(){
  if(!currentRoom) return;
  const {data} = await sb.from('direct_messages').select('from_user_id, created_at').eq('room_id', currentRoom.id).eq('to_user_id', myId);
  if(!data || data.length === 0){ setBadge(0); return; }
  const {data: reads} = await sb.from('dm_reads').select('*').eq('room_id', currentRoom.id).eq('user_id', myId);
  const readMap = {}; (reads || []).forEach(r => { readMap[r.peer_id] = new Date(r.last_read_at).getTime(); });
  let unread = 0;
  data.forEach(m => { const last = readMap[m.from_user_id] || 0; if(new Date(m.created_at).getTime() > last) unread++; });
  setBadge(unread);
}

function setBadge(n){
  const b = document.getElementById('dmBadge'); if(!b) return;
  b.textContent = n > 0 ? String(n) : '';
  b.className = n > 0 ? 'badge' : '';
  }
  function openActionsSheet(){
  if(!currentRoom) return;
  const r = currentRoom;
  const days = getDaysLeft(r.expires_at);
  const canExtendNow = isHost && days !== null && days <= 2 && (!r.extended_at || (Date.now() - new Date(r.extended_at).getTime()) > 8 * 86400000);
  const hasPersonal = !!getPersonalVideo();
  openSheet(
    '<h2>⚙️ Управление</h2><div class="sheet-list">' +
    '<div class="sheet-item" onclick="closeSheet();openVideoSheet()"><span class="ic">🎬</span> ' + (r.video_url ? 'Заменить общее видео' : 'Выбрать общее видео') + '</div>' +
    '<div class="sheet-item" onclick="closeSheet();openPersonalVideoSheet()"><span class="ic">🫈</span> ' + (hasPersonal ? 'Заменить своё видео' : 'Своё видео (только для тебя)') + '</div>' +
    (canExtendNow ? '<div class="sheet-item" onclick="closeSheet();extendRoom()"><span class="ic">📅</span> Продлить на 10 дней<span class="badge-auto">осталось ' + days + ' дн.</span></div>' : '') +
    (isHost ? '<div class="sheet-item danger" onclick="closeSheet();deleteRoom()"><span class="ic">🗑️</span> Удалить комнату</div>' : '') +
    '<div class="sheet-item" onclick="closeSheet();leaveRoom()"><span class="ic">🚪</span> Выйти из комнаты</div></div>'
  );
}

function startHeartbeat(){
  if(heartbeatInterval) clearInterval(heartbeatInterval);
  heartbeatInterval = setInterval(() => { if(currentRoom) upsertPresence(); }, 30000);
}

(async function init(){
  const g = document.getElementById('greeting');
  if(g) g.textContent = getGreeting();

  cleanupRooms();
  findWorkingInvidious();
  await loadRooms();

  sb.channel('rooms-list')
    .on('postgres_changes', {event:'*', schema:'public', table:'rooms'}, scheduleRoomsReload)
    .subscribe();

  startHeartbeat();

  // Реакция на поворот экрана / изменение размера
  let resizeTimer = null;
  const handleOrientationChange = () => {
    if(!currentRoom) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      // Перерисовать комнату — DOM у портрета и ландшафта разный
      const panel = document.getElementById('roomBottomPanel');
      if(panel) panel.innerHTML = buildDock();
      updateDMBadge();
    }, 200);
  };
  window.addEventListener('orientationchange', handleOrientationChange);
  window.addEventListener('resize', handleOrientationChange);

  const params = new URLSearchParams(location.search);
  const roomParam = params.get('room');
  if(roomParam) enterRoom(roomParam);
  else restoreLastRoom();
})();
</script>
