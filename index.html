.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px 16px; border-radius:10px; font-size:14px; font-weight:700; background:var(--surface-2); border:1px solid var(--border); color:var(--text); min-height:46px; width:100%; margin-top:6px; text-align:center; }

.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.ghost { background:transparent; }
.btn.danger { background:var(--danger); color:#fff; border-color:var(--danger); }
.btn.small { width:auto; padding:8px 12px; min-height:36px; font-size:12px; margin:0; }

.video-box { background:#000; border:1px solid var(--border); border-radius:10px; overflow:hidden; aspect-ratio:16/9; margin-bottom:12px; display:flex; align-items:center; justify-content:center; position:relative; }

.play-overlay .text { font-size:20px; font-weight:800; color:#fff; }
.play-overlay .hint { font-size:12px; color:#ccc; }

  .dm-box { display:flex; flex-direction:column; height:55vh; min-height:300px; }

  .dm-msg.mine { background:var(--accent); color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
  .dm-msg.their { background:var(--surface-2); color:var(--text); margin-right:auto; border-bottom-left-radius:4px; }
  .dm-time { font-size:10px; opacity:0.6; margin-top:3px; }
  .dm-row { padding:12px; border-bottom:1px solid var(--border); cursor:pointer; }
  .dm-row:active { background:var(--surface-2); }
  .dm-row:last-child { border-bottom:none; }
  .dm-row-name { font-size:14px; font-weight:700; margin-bottom:3px; }
  .dm-row-preview { font-size:12px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .toast-root { position:fixed; left:0; right:0; bottom:110px; z-index:200; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; padding:0 12px; }
  .toast { background:var(--surface-2); color:var(--text); padding:10px 16px; border-radius:20px; font-size:13px; font-weight:600; max-width:100%; border:1px solid var(--border); animation:toastIn 0.25s; text-align:center; }
  .toast.error { background:var(--danger); color:#fff; }
  .toast.success { background:var(--success); color:#fff; }
  @keyframes toastIn { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }

  .help-content { font-size:14px; line-height:1.6; color:var(--text-2); }
  .help-content h3 { font-size:14px; color:var(--text); margin:12px 0 5px; font-weight:800; }
  .help-content h3:first-child { margin-top:0; }
  .help-content .tip { background:var(--surface-2); border-left:3px solid var(--accent); padding:10px; border-radius:6px; margin:8px 0; font-size:13px; }
  .hidden-note { font-size:12px; color:var(--text-3); font-style:italic; padding:8px; text-align:center; }
</style>

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg,type){
  const r=document.getElementById('toastRoot');
  const el=document.createElement('div');
  el.className='toast '+(type||'');
  el.textContent=msg;
  r.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity 0.3s';setTimeout(()=>el.remove(),300);},3000);
}
function openSheet(html){document.getElementById('modalRoot').innerHTML='<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet">'+html+'</div></div>';}
function closeSheet(){document.getElementById('modalRoot').innerHTML='';}
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('fabCreate').style.display=name==='home'?'flex':'none';
  window.scrollTo(0,0);
}
function setView(v){
  viewMode=v; localStorage.setItem(LS_VIEW,v);
  document.querySelectorAll('#viewToggle button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  renderRooms();
}
function getDaysLeft(exp){if(!exp)return null;const d=new Date(exp)-new Date();return Math.max(0,Math.ceil(d/86400000));}
function encodePass(p){return btoa(unescape(encodeURIComponent(p)));}

function openHelp(){

    '<button class="btn ghost" style="margin-top:16px;" onclick="closeSheet()">Понятно</button>');
}
async function cleanupRooms(){
  const last=localStorage.getItem(LS_LAST_CLEANUP), now=Date.now();
  if(last && now-parseInt(last)<3600000) return;
  try{await sb.rpc('cleanup_rooms_fn');localStorage.setItem(LS_LAST_CLEANUP,now.toString());}catch(e){}
}
async function loadRooms(){
  try{
    const {data,error}=await sb.from('rooms').select('*')
      .gt('expires_at',new Date().toISOString())
      .order('created_at',{ascending:false});
    if(error){console.error(error);toast('Ошибка: '+error.message,'error');return;}
    rooms = (data||[]).filter(r => !r.is_hidden || r.host_id === myId);
    renderRooms();
  }catch(e){console.error(e);}
}
function renderRooms(){
  const area=document.getElementById('roomsArea'), empty=document.getElementById('emptyState');
  if(rooms.length===0){area.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  if(viewMode==='bubbles'){
    area.className='rooms-bubbles';
    area.innerHTML=rooms.map(r=>{
      const days=getDaysLeft(r.expires_at);
      const warn=(days!==null&&days<=2)?'<div class="bubble-badge">'+days+'д</div>':'';

async function generateRoomName(base){
  const b=base.trim(); if(!b) return '';
  try{
    const {data}=await sb.from('rooms').select('name').ilike('name', b+'%');
    if(!data || data.length===0) return b;
    let max=0;
    data.forEach(r=>{
      if(r.name===b) max=Math.max(max,1);
      else {
        const m=r.name.match(new RegExp('^'+b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+' (\\d+)$'));
        if(m) max=Math.max(max, parseInt(m[1]));
      }
    });
    return max===0 ? b : b+' '+(max+1);
  } catch(e){ return b; }
}

  function parseVideoUrl(url){
  if(!url) return null;
  url=url.trim();
  if(!url.match(/^https?:\/\//i)) return null;
  const yt=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(yt) return {type:'invidious',videoId:yt[1],src:currentInvidious+'/embed/'+yt[1],embeddable:true};
  const rt=url.match(/rutube\.ru\/(?:video|play\/embed|live)\/([a-zA-Z0-9]+)/);
  if(rt) return {type:'iframe',src:'https://rutube.ru/play/embed/'+rt[1],embeddable:true};
  const vk=url.match(/(?:vk\.com|vkvideo\.ru)\/video(-?\d+)_(\d+)/);
  if(vk) return {type:'iframe',src:'https://vk.com/video_ext.php?oid='+vk[1]+'&id='+vk[2]+'&autoplay=0',embeddable:true};
  const dm=url.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/);
  if(dm) return {type:'iframe',src:'https://www.dailymotion.com/embed/video/'+dm[1],embeddable:true};
  const vm=url.match(/vimeo\.com\/(\d+)/);
  if(vm) return {type:'iframe',src:'https://player.vimeo.com/video/'+vm[1],embeddable:true};
  const tw=url.match(/twitch\.tv\/([a-zA-Z0-9_]+)$/);
  if(tw) return {type:'iframe',src:'https://player.twitch.tv/?channel='+tw[1]+'&parent='+window.location.hostname,embeddable:true};
  const ok=url.match(/ok\.ru\/video\/(\d+)/);
  if(ok) return {type:'iframe',src:'https://ok.ru/videoembed/'+ok[1],embeddable:true};
  const tg=url.match(/t\.me\/([a-zA-Z0-9_]+)\/(\d+)/);
  if(tg) return {type:'iframe',src:'https://t.me/'+tg[1]+'/'+tg[2]+'?embed=1',embeddable:true};
  if(url.match(/\.(mp4|webm|ogg|mov|m4v)(\?|$)/i)) return {type:'html5',src:url,embeddable:true};
  if(url.match(/\.m3u8(\?|$)/i)) return {type:'hls',src:url,embeddable:true};
  return {type:'iframe',src:url,embeddable:false};
}
async function enterRoom(roomId){
  let room=rooms.find(r=>r.id===roomId);
  if(!room){
    const {data,error}=await sb.from('rooms').select('*').eq('id',roomId).limit(1);
    if(error||!data||data.length===0) return toast('Комната не найдена','error');
    room=data[0];
    if(!rooms.find(r=>r.id===roomId)) rooms.push(room);
  }
  if(room.expires_at && new Date(room.expires_at)<new Date()) return toast('Комната удалена (срок истёк)','error');

  if(room.is_hidden && room.host_id !== myId){
    const params=new URLSearchParams(window.location.search);
    const urlInvite=params.get('invite');
    const savedInvite=sessionStorage.getItem('room_invite_'+roomId);
    const savedOk=(urlInvite===room.invite_code)||(savedInvite===room.invite_code);
    if(!savedOk) return toast('Скрытая комната. Открой по ссылке от хоста.','error');
    sessionStorage.setItem('room_invite_'+roomId, room.invite_code);
  }

  if(room.password_hash && room.host_id !== myId){
    const savedPass=sessionStorage.getItem('room_pass_'+roomId);
    const okPass = savedPass === room.password_hash;
    if(!okPass){
      const entered = prompt('Комната с паролем. Введи пароль:');
      if(!entered) return;
      const hash = encodePass(entered);
      if(hash !== room.password_hash) return toast('Неверный пароль','error');
      sessionStorage.setItem('room_pass_'+roomId, hash);
    }
  }

  currentRoom=room;
  isHost=(room.host_id===myId);
  showScreen('room');
  renderRoom();
  await loadRoomMessages(roomId);
  await loadPresence();
  await upsertPresence();
  await logActivity('enter');
  updateDMBadge();

  if(roomChannel) sb.removeChannel(roomChannel);
  if(dmChannel) sb.removeChannel(dmChannel);
  if(presenceChannel) sb.removeChannel(presenceChannel);
  roomChannel=sb.channel('room-'+roomId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'room_messages'},payload=>{
      if(payload.new.room_id===roomId) loadRoomMessages(roomId);
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'rooms',filter:'id=eq.'+roomId},p=>{
      if(currentRoom&&currentRoom.id===roomId){
        const oldV=currentRoom.video_url;
        currentRoom=p.new;
        if(oldV!==p.new.video_url) renderRoom();
      }
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'rooms',filter:'id=eq.'+roomId},()=>{
      toast('Комната удалена','error');
      leaveRoom();
    })
    .subscribe();
  dmChannel=sb.channel('dm-'+myId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'direct_messages',filter:'to_user_id=eq.'+myId},p=>{
      if(p.new.room_id!==currentRoom?.id) return;
      toast('Вам сообщение от '+(p.new.from_name||'гостя'),'success');
      updateDMBadge();
    }).subscribe();
  presenceChannel=sb.channel('presence-'+roomId)
    .on('postgres_changes',{event:'*',schema:'public',table:'room_presence',filter:'room_id=eq.'+roomId},()=>loadPresence())
    .subscribe();
  if(room.countdown_start){
    const d=Math.ceil((new Date(room.countdown_start).getTime()-Date.now())/1000);
    if(d>0) startCountdown();
  }
  }

  inp.value='';
  const {error}=await sb.from('room_messages').insert({
    room_id:currentRoom.id, name:name, avatar:avatar, text:text, user_id:myId, status:myStatus, hidden:false
  });
  if(error){toast('Ошибка: '+error.message,'error');return;}
  await loadRoomMessages(currentRoom.id);
}
async function hideMessage(id){
  try{
    await sb.from('message_hides').insert({message_id:id,user_id:myId});
    const {data}=await sb.from('message_hides').select('*').eq('message_id',id);
    if((data||[]).length>=3){
      await sb.from('room_messages').update({hidden:true}).eq('id',id);
      toast('Скрыто у всех','success');
    } else toast('Скрыто у тебя ('+(data||[]).length+'/3)');
    await loadRoomMessages(currentRoom.id);
  }catch(e){toast('Ошибка: '+e.message,'error');}
  }
  async function openDM(userId,userName){
  if(userId===myId) return toast('Это ты');
  await sb.from('dm_reads').upsert({
    room_id:currentRoom.id, user_id:myId, peer_id:userId,
    last_read_at:new Date().toISOString()
  });
  const {data}=await sb.from('direct_messages').select('*').eq('room_id',currentRoom.id)
    .or('and(from_user_id.eq.'+myId+',to_user_id.eq.'+userId+'),and(from_user_id.eq.'+userId+',to_user_id.eq.'+myId+')')
    .order('created_at',{ascending:true});
  const html=(data||[]).map(m=>{
    const mine=m.from_user_id===myId;
    return '<div class="dm-msg '+(mine?'mine':'their')+'">'+esc(m.text)+'<div class="dm-time">'+new Date(m.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</div></div>';
  }).join('');
  openSheet('<h2>Личные с '+esc(userName)+'</h2>'+
    '<input type="hidden" id="dmPeerId" value="'+esc(userId)+'">'+
    '<div class="dm-box">'+
      '<div class="dm-messages" id="dmMessages">'+(html||'<div class="hidden-note">Начни переписку</div>')+'</div>'+
      '<div class="chat-input-row">'+
        '<input id="dmInput" class="input" placeholder="Сообщение..." maxlength="500">'+
        '<button class="btn primary small" onclick="sendDM(\''+userId+'\',\''+esc(userName)+'\')">Отправить</button>'+
      '</div>'+
    '</div>'+
    '<button class="btn ghost" onclick="closeSheet()">Закрыть</button>');
  setTimeout(()=>{
    const b=document.getElementById('dmMessages'); if(b)b.scrollTop=b.scrollHeight;
    const i=document.getElementById('dmInput'); if(i)i.addEventListener('keydown',e=>{if(e.key==='Enter')sendDM(userId,userName);});
  },100);
  updateDMBadge();
}
async function sendDM(userId,userName){
  const inp=document.getElementById('dmInput'); if(!inp) return;
  const text=inp.value.trim(); if(!text) return;
  inp.value='';
  const name=localStorage.getItem(LS_MY_NAME)||'Гость';
  await sb.from('direct_messages').insert({
    room_id:currentRoom.id, from_user_id:myId, to_user_id:userId,
    from_name:name, to_name:userName, text:text
  });
  openDM(userId,userName);
}
async function loadPresence(){
  const {data}=await sb.from('room_presence').select('*').eq('room_id',currentRoom.id);
  currentPresence=data||[];
}
async function upsertPresence(){
  await sb.from('room_presence').upsert({
    room_id:currentRoom.id, user_id:myId,
    name:localStorage.getItem(LS_MY_NAME)||'Гость',
    status:myStatus, updated_at:new Date().toISOString()
  });
}
async function updateDMBadge(){
  if(!currentRoom) return;
  const {data}=await sb.from('direct_messages')
    .select('from_user_id, created_at')
    .eq('room_id', currentRoom.id).eq('to_user_id', myId);
  if(!data||data.length===0){ setBadge(0); return; }
  const {data:reads}=await sb.from('dm_reads')
    .select('*').eq('room_id', currentRoom.id).eq('user_id', myId);
  const readMap={};
  (reads||[]).forEach(r=>{ readMap[r.peer_id]=new Date(r.last_read_at).getTime(); });
  let unread=0;
  data.forEach(m=>{
    const last=readMap[m.from_user_id]||0;
    if(new Date(m.created_at).getTime()>last) unread++;
  });
  setBadge(unread);
}
function setBadge(n){
  const b=document.getElementById('dmBadge');
  if(!b) return;
  b.textContent = n>0 ? '('+n+')' : '';
  b.style.color = n>0 ? '#fff' : '';
}
async function openDMList(){
  if(!currentRoom) return;
  const {data}=await sb.from('direct_messages').select('*').eq('room_id', currentRoom.id)
    .or('from_user_id.eq.'+myId+',to_user_id.eq.'+myId)
    .order('created_at',{ascending:false});
  const dialogs={};
  (data||[]).forEach(m=>{
    const peer=m.from_user_id===myId?m.to_user_id:m.from_user_id;
    const peerName=m.from_user_id===myId?m.to_name:m.from_name;
    if(!dialogs[peer]) dialogs[peer]={peerId:peer, peerName:peerName, lastMsg:m.text, lastAt:m.created_at};
  });
  const {data:reads}=await sb.from('dm_reads').select('*')
    .eq('room_id', currentRoom.id).eq('user_id', myId);
  const readMap={};
  (reads||[]).forEach(r=>{ readMap[r.peer_id]=new Date(r.last_read_at).getTime(); });
  const items=Object.values(dialogs);
  const html=items.length===0
    ? '<div class="hidden-note">Пока нет переписок</div>'
    : items.map(d=>{
        const unread=new Date(d.lastAt).getTime()>(readMap[d.peerId]||0);
        return '<div class="dm-row" onclick="openDM(\''+d.peerId+'\',\''+esc(d.peerName)+'\')">'+
          '<div class="dm-row-name">'+esc(d.peerName)+(unread?' <span style="color:var(--accent)">· новое</span>':'')+'</div>'+
          '<div class="dm-row-preview">'+esc((d.lastMsg||'').slice(0,50))+'</div>'+
        '</div>';
      }).join('');
  openSheet('<h2>Личные сообщения</h2>'+
    '<div style="max-height:60vh; overflow-y:auto; margin-bottom:12px;">'+html+'</div>'+
    '<button class="btn ghost" onclick="closeSheet()">Закрыть</button>');
}
async function extendRoom(){
  if(!currentRoom) return;
  const ne=new Date(); ne.setDate(ne.getDate()+10);
  const {error}=await sb.from('rooms').update({expires_at:ne.toISOString()}).eq('id',currentRoom.id);
  if(error){toast('Ошибка: '+error.message,'error');return;}
  currentRoom.expires_at=ne.toISOString();
  await logActivity('extend');
  toast('Продлено на 10 дней','success');
  renderRoom(); loadRooms();
}
async function deleteRoom(){
  if(!currentRoom) return;
  if(!confirm('Удалить комнату «'+currentRoom.name+'»? Всё удалится.')) return;
  await sb.from('rooms').delete().eq('id',currentRoom.id);
  toast('Комната удалена','success');
  leaveRoom();
}
async function refreshInviteCode(){
  if(!currentRoom || !isHost) return;
  if(!confirm('Обновить код приглашения? Старые ссылки перестанут работать.')) return;
  const newCode = 'inv_' + Math.random().toString(36).slice(2,12);
  const {error}=await sb.from('rooms').update({invite_code: newCode}).eq('id', currentRoom.id);
  if(error){toast('Ошибка: '+error.message,'error');return;}
  currentRoom.invite_code = newCode;
  toast('Новый код создан','success');
  renderRoom();
}
function getExtendButtonHtml(r){
  if(!r.expires_at) return '';
  const d=Math.ceil((new Date(r.expires_at)-new Date())/86400000);
  if(d<=2) return '<button class="btn small primary" onclick="extendRoom()">Продлить ('+d+' дн.)</button>';
  return '';
}
function copyShareLink(){
  const r=currentRoom;
  const url = window.location.origin+window.location.pathname+'?room='+r.id+(r.invite_code?'&invite='+r.invite_code:'');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(url).then(()=>toast('Ссылка скопирована','success')).catch(()=>fallbackCopy(url));
  } else fallbackCopy(url);
}
function fallbackCopy(t){
  const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0';
  document.body.appendChild(a); a.focus(); a.select();
  try{document.execCommand('copy');toast('Скопировано','success');}catch(e){toast('Скопируй вручную: '+t,'error');}
  a.remove();
}
function leaveRoom(){
  if(window._msgPoll){clearInterval(window._msgPoll); window._msgPoll=null;}
  if(roomChannel){sb.removeChannel(roomChannel);roomChannel=null;}
  if(dmChannel){sb.removeChannel(dmChannel);dmChannel=null;}
  if(presenceChannel){sb.removeChannel(presenceChannel);presenceChannel=null;}
  if(syncInterval){clearInterval(syncInterval);syncInterval=null;}
  if(countdownInterval){clearInterval(countdownInterval);countdownInterval=null;}
  currentRoom=null;
  currentRoomMessages=[];
  currentPresence=[];
  myStatus='общее';
  showScreen('home');
}
async function logActivity(action){
  try{await sb.from('user_activity').insert({user_id:myId,room_id:currentRoom?currentRoom.id:null,action:action});}catch(e){}
  }
  async function checkInvidious(url){
  try{
    const r = await fetch(url+'/api/v1/stats', {
      signal: AbortSignal.timeout(2500)
    });
    if(!r.ok) return false;
    const data = await r.json();
    return data && (data.version || data.software);
  }catch(e){
    return false;
  }
}
async function findWorkingInvidious(){
  const saved = localStorage.getItem(LS_INVIDIOUS);
  if(saved && await checkInvidious(saved)){
    currentInvidious = saved;
    console.log('Invidious OK (saved):', saved);
    return saved;
  }
  for(const url of INVIDIOUS_INSTANCES){
    if(await checkInvidious(url)){
      currentInvidious = url;
      localStorage.setItem(LS_INVIDIOUS, url);
      console.log('Invidious OK:', url);
      return url;
    }
  }
  return null;
}
function switchServer(){
  const idx = INVIDIOUS_INSTANCES.indexOf(currentInvidious);
  const next = INVIDIOUS_INSTANCES[(idx+1) % INVIDIOUS_INSTANCES.length];
  currentInvidious = next;
  localStorage.setItem(LS_INVIDIOUS, next);
  toast('Сервер: ' + new URL(next).hostname);
  if(currentRoom) renderRoom();
}
async function heartbeat(){
  if(!currentRoom) return;
  try{await upsertPresence();}catch(e){}
}
setInterval(heartbeat, 30000);

sb.channel('rooms-list').on('postgres_changes',{event:'*',schema:'public',table:'rooms'},()=>loadRooms()).subscribe();

(async function init(){
  document.querySelectorAll('#viewToggle button').forEach(b=>b.classList.toggle('active',b.dataset.view===viewMode));
  await cleanupRooms();
  await findWorkingInvidious();
  await loadRooms();
  const params=new URLSearchParams(window.location.search);
  const roomParam=params.get('room');
  if(roomParam) enterRoom(roomParam);
})();
</script>
</body>
</html>
