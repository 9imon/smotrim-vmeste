<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивная стриминговая платформа</title>
    <style>
        /* =========================================
           БАЗОВЫЕ СТИЛИ
           ========================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #14141c;
            color: #ffffff;
            height: 100vh;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* =========================================
           СЕТКА САЙТА (GRID)
           ========================================= */
        .app-layout {
            display: grid;
            grid-template-columns: 32% 1fr; /* Профиль/Чат (32%) и Плеер (остальное) */
            grid-template-rows: 60px 1fr;   /* Верхняя панель и Основная часть */
            grid-template-areas: 
                "header header"
                "sidebar main";
            height: 100vh;
            padding: 10px 20px 20px 20px;
            gap: 20px;
        }

        /* =========================================
           ВЕРХНЯЯ ПАНЕЛЬ (Навигация)
           ========================================= */
        .top-bar {
            grid-area: header;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Плашка Профиля */
        .pro-profile {
            background-color: #1e1e28;
            border: 1px solid #333;
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%; /* Заполняет свою колонку сетки */
            font-size: 14px;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            margin-left: auto;
            margin-right: 10px;
        }

        /* Контейнер кнопок */
        .top-nav-buttons {
            display: flex;
            gap: 8px;
            flex: 1; 
        }

        .nav-btn {
            background-color: #1e1e28;
            color: #aaa;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            white-space: nowrap;
            flex: 1; /* Кнопки растягиваются равномерно */
        }

        .nav-btn:hover { background-color: #2a2a35; color: #fff; }
        .nav-btn.active { background-color: #7c3aed; color: #fff; border-color: #7c3aed; }
        #menu-btn { font-weight: bold; background-color: #2a2a35; }

        /* =========================================
           ОСНОВНЫЕ БЛОКИ
           ========================================= */
        /* Плеер (Слева на ПК) */
        .video-section {
            grid-area: main;
            background-color: #000;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .video-placeholder { text-align: center; color: #666; }
        .video-placeholder .icon { font-size: 48px; margin-bottom: 15px; }
        .video-placeholder h2 { color: #ccc; font-size: 18px; margin-bottom: 5px; }

        /* Правая колонка (Чат) */
        .sidebar-section {
            grid-area: sidebar;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .content-window {
            flex: 1;
            background-color: #1e1e28;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- ЧАТ --- */
        .chat-view { display: flex; flex-direction: column; height: 100%; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { display: flex; gap: 10px; font-size: 14px; }
        .avatar { width: 32px; height: 32px; background-color: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
        .msg-author { color: #fff; font-weight: bold; margin-bottom: 2px; }
        .msg-text { color: #ccc; }
        .msg-time { font-size: 10px; color: #666; margin-top: 3px; }

        .chat-input-area { display: flex; padding: 10px; gap: 10px; border-top: 1px solid #333; background-color: #1e1e28; }
        .chat-input-area input { flex: 1; background-color: #14141c; border: 1px solid #333; border-radius: 20px; padding: 10px 15px; color: #fff; outline: none; }
        .send-btn { background-color: #7c3aed; border: none; border-radius: 50%; width: 40px; height: 40px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* --- МЕНЮ --- */
        .menu-view { display: none; padding: 20px; flex-direction: column; gap: 15px; height: 100%; overflow-y: auto; }
        .menu-item { padding: 15px; background-color: #2a2a35; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .menu-item:hover { background-color: #3b3b4a; }


        /* =========================================
           МОБИЛЬНАЯ ВЕРСИЯ (Вертикальный вид)
           ========================================= */
        @media (max-width: 900px) {
            body {
                overflow-y: auto; /* Разрешаем скролл страницы на телефоне */
            }

            /* Перестраиваем сетку для телефона */
            .app-layout {
                grid-template-columns: 1fr; /* Одна колонка */
                grid-template-rows: auto auto 1fr auto; /* Авто-высота для плеера и чата, 1fr для заполнения, auto для кнопок */
                grid-template-areas: 
                    "header"  /* 1. Профиль */
                    "main"    /* 2. Плеер */
                    "sidebar" /* 3. Чат */
                    "header"; /* 4. КНОПКИ ВНИЗУ! */
                height: 100vh;
                padding: 10px;
                gap: 15px;
            }

            .top-bar {
                flex-direction: column; /* Профиль сверху, кнопки снизу */
                align-items: stretch;
                height: 100%;
            }

            /* Прячем профиль в мобильной версии, чтобы не мешал (опционально) */
            .pro-profile {
                display: none; 
            }

            /* Кнопки уходят в самый низ */
            .top-nav-buttons {
                /* Фиксируем кнопки внизу экрана */
                position: fixed; 
                bottom: 0;
                left: 0;
                width: 100%;
                background-color: #14141c; /* Фон под кнопками */
                padding: 10px;
                border-top: 1px solid #333;
                z-index: 100;
                gap: 4px;
                box-sizing: border-box;
            }

            .nav-btn {
                padding: 8px 4px;
                font-size: 11px;
                border-radius: 8px;
            }

            /* Плеер на телефоне */
            .video-section {
                min-height: 220px;
                order: 1; /* Плеер идет первым */
            }

            /* Чат на телефоне (должен занимать оставшееся место) */
            .sidebar-section {
                order: 2; /* Чат идет после плеера */
                min-height: 350px; 
                margin-bottom: 70px; /* Отступ, чтобы нижняя панель не перекрывала ввод сообщения */
            }
        }
    </style>
</head>
<body>

    <!-- Общая сетка -->
    <div class="app-layout">
        
        <!-- Шапка (На ПК: Профиль + Кнопки) -->
        <header class="top-bar">
            <div class="pro-profile">
                <span>Про</span>
                <span style="color: #888; font-size: 12px;">10дн</span>
                <div class="status-dot"></div>
                <span>2</span>
                <button style="background:none; border:none; color:#888; cursor:pointer;">⚙️</button>
            </div>

            <!-- Кнопки. На ПК они здесь, на телефоне CSS перенесет их вниз -->
            <div class="top-nav-buttons">
                <button class="nav-btn active" onclick="switchTab('home', this)">Главная</button>
                <button class="nav-btn" onclick="switchTab('general', this)">Общее</button>
                <button class="nav-btn" onclick="switchTab('custom', this)">Своё</button>
                <button class="nav-btn" onclick="switchTab('people', this)">Люди</button>
                <button class="nav-btn" onclick="switchTab('invite', this)">Пригласить</button>
                <button class="nav-btn" id="menu-btn" onclick="toggleMenu(this)">Меню</button>
            </div>
        </header>

        <!-- Плеер (Слева на ПК, Сверху на телефоне) -->
        <section class="video-section">
            <div class="video-placeholder">
                <div class="icon">📺</div>
                <h2>Тут будет видео</h2>
                <p>Хост ещё не выбрал</p>
            </div>
        </section>

        <!-- Правая панель (Чат) -->
        <aside class="sidebar-section">
            <div class="content-window">
                
                <!-- Чат -->
                <div class="chat-view" id="chat-view">
                    <div class="chat-messages">
                        <div class="message">
                            <div class="avatar">АК</div>
                            <div class="msg-content">
                                <span class="msg-author">ак</span>
                                <span class="msg-text">Просто</span>
                                <span class="msg-time">20:29</span>
                            </div>
                        </div>
                        <div class="message">
                            <div class="avatar" style="background:#e11d48">Ив</div>
                            <div class="msg-content">
                                <span class="msg-author">Иван</span>
                                <span class="msg-text">Привет всем! Когда стрим?</span>
                                <span class="msg-time">20:31</span>
                            </div>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" placeholder="Сообщение...">
                        <button class="send-btn">➤</button>
                    </div>
                </div>

                <!-- Меню (Скрыто) -->
                <div class="menu-view" id="menu-view">
                    <h3>Настройки и меню</h3>
                    <div class="menu-item">⚙️ Настройки профиля</div>
                    <div class="menu-item">🔔 Уведомления</div>
                    <div class="menu-item">🎨 Оформление</div>
                </div>

            </div>
        </aside>
    </div>

    <script>
        const chatView = document.getElementById('chat-view');
        const menuView = document.getElementById('menu-view');
        const navButtons = document.querySelectorAll('.nav-btn');

        function switchTab(tabName, btnElement) {
            navButtons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            chatView.style.display = 'flex';
            menuView.style.display = 'none';
        }

        function toggleMenu(btnElement) {
            navButtons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            chatView.style.display = 'none';
            menuView.style.display = 'flex';
        }
    </script>
</body>
</html>
