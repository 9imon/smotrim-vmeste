  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 12px; font-size: 15px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); min-height: 50px; width: 100%; margin-top: 8px; }

.btn.ghost { background: transparent; }
.btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }

.room-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-2); }

  .chat-msg { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
  .chat-msg:last-child { border-bottom: none; }
  .chat-msg-avatar { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; background: var(--surface-2); }
  .chat-msg-body { flex: 1; min-width: 0; }
  .chat-msg-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .chat-msg-text { font-size: 14px; word-wrap: break-word; }
  .chat-msg-time { font-size: 10px; color: var(--text-3); margin-top: 3px; }
  .chat-msg-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  .chat-msg-btn { background: none; border: none; color: var(--text-3); font-size: 14px; padding: 4px; cursor: pointer; }
  .chat-msg-btn:active { transform: scale(0.9); color: var(--danger); }
  .chat-msg-btn.dm:active { color: var(--accent); }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input { margin-bottom: 0; flex: 1; }
  .chat-input-row .btn { width: auto; padding: 12px 18px; margin: 0; min-height: 46px; }
  .dm-box { display: flex; flex-direction: column; height: 50vh; min-height: 300px; }
  .dm-messages { flex: 1; overflow-y: auto; padding: 8px; background: var(--bg); border-radius: 12px; margin-bottom: 10px; }
  .dm-msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; margin-bottom: 6px; font-size: 14px; word-wrap: break-word; }
  .dm-msg.mine { background: var(--accent); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .dm-msg.their { background: var(--surface-2); color: var(--text); margin-right: auto; border-bottom-left-radius: 4px; }
  .dm-time { font-size: 10px; opacity: 0.6; margin-top: 3px; }
  .toast-root { position: fixed; left: 0; right: 0; bottom: 130px; z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .toast { background: var(--surface-2); color: var(--text); padding: 12px 20px; border-radius: 24px; font-size: 14px; font-weight: 600; max-width: 90%; border: 1px solid var(--border); animation: toastIn 0.25s; }
  .toast.error { background: var(--danger); color: #fff; border-color: var(--danger); }
  .toast.success { background: var(--success); color: #fff; border-color: var(--success); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .help-content { font-size: 14px; line-height: 1.7; color: var(--text-2); }
  .help-content h3 { font-size: 15px; color: var(--text); margin: 16px 0 8px; font-weight: 800; }
  .help-content h3:first-child { margin-top: 0; }
  .help-content p { margin-bottom: 8px; }
  .help-content .tip { background: var(--surface-2); border-left: 3px solid var(--accent); padding: 12px; border-radius: 6px; margin: 10px 0; font-size: 13px; }
  .hidden-note { font-size: 12px; color: var(--text-3); font-style: italic; padding: 8px; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>

<script>
const SUPABASE_URL = 'https://aritoekxhdmskwiejqve.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyaXRvZWt4aGRtc2t3aWVqcXZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MDA3MjAsImV4cCI6MjEwNzA3NjcyMH0.smtTA67icGqn0vD9fbDzyc8bdKqz_O-b7D1M3bgSqm4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const LS_MY_ID = 'smotrim_my_id';
const LS_MY_NAME = 'smotrim_my_name';
const LS_MY_AVATAR = 'smotrim_my_avatar';
const LS_VIEW = 'smotrim_view';
const LS_LAST_CLEANUP = 'smotrim_last_cleanup';
const LS_INVIDIOUS = 'smotrim_invidious';

const INVIDIOUS_INSTANCES = [
  'https://inv.nadeko.net',
  'https://invidious.nerdvpn.de',

  'https://invidious.f5.si',
  'https://yewtu.be'
];

let currentInvidious = localStorage.getItem(LS_INVIDIOUS) || INVIDIOUS_INSTANCES[0];

let myId = localStorage.getItem(LS_MY_ID);
if (!myId) { myId = 'u_' + Math.random().toString(36).slice(2, 10); localStorage.setItem(LS_MY_ID, myId); }

const AVATARS = ['🎬','🍿','🎥','📺','🎭','🎨','🌟','🌙','☀️','🔥','💎','🎪','🎯','🎲','🎸','🎤','📷','🎮','🚀','🌈'];
const COLORS = ['#ff6b9d','#ffa06b','#ffd93d','#6bcf7f','#6bc5ff','#a06bff','#ff6b6b','#5eead4','#f472b6','#93c5fd','#fcd34d','#86efac'];

let rooms = [];
let currentRoom = null;
let currentRoomMessages = [];
let viewMode = localStorage.getItem(LS_VIEW) || 'bubbles';
let selectedAvatar = AVATARS[0];
let selectedColor = COLORS[0];
let roomChannel = null;
let dmChannel = null;
let ytPlayer = null;
let ytPlayerReady = false;
let suppressSync = false;
let syncInterval = null;
let countdownInterval = null;
let isHost = false;

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nowTime() { const d = new Date(); return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0'); }
function toast(msg, type) {
  const r = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  r.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); }, 3000);
}
function openSheet(html) { document.getElementById('modalRoot').innerHTML = '<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet">' + html + '</div></div>'; }
function closeSheet() { document.getElementById('modalRoot').innerHTML = ''; }
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.getElementById('fabCreate').style.display = name === 'home' ? 'flex' : 'none';
  window.scrollTo(0, 0);
}
function setView(v) {
  viewMode = v;
  localStorage.setItem(LS_VIEW, v);
  document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  renderRooms();
}
function getDaysLeft(expiresAt) {
  if (!expiresAt) return null;
  const diff = new Date(expiresAt) - new Date();
  return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
}
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function generateInviteCode() {
  return 'inv_' + Math.random().toString(36).slice(2, 12);
}
  function openHelp() {
  openSheet(
    '<h2>📖 Как пользоваться</h2><div class="help-content">' +
    '<h3>🎬 Создать комнату</h3><p>Нажми <b>🎬 внизу</b>. Комната живёт <b>10 дней</b>.</p>' +
    '<h3>🔒 Приватность</h3><p>Комната может быть: публичная, скрытая или с паролем.</p>' +
    '<h3>📺 Видео</h3><p>Хост выбирает видео через <b>📺</b>. YouTube через Invidious, RuTube, VK, Twitch, .mp4, .m3u8.</p>' +
    '<h3>🔢 Счётчик</h3><p>5 секунд перед стартом. YouTube/.mp4 — автостарт. VK/RuTube — «Нажми Play».</p>' +
    '<h3>💬 Чат и ЛС</h3><p>Общий чат + личные сообщения — нажми <b>💬</b> рядом с сообщением.</p>' +
    '<h3>👑 Хост</h3><p>Может менять видео, продлить ⏱, удалить 🗑.</p>' +
    '<div class="tip">Гость может управлять плеером, но не может вставить своё видео.</div></div>' +
    '<button class="btn ghost" style="margin-top:16px;" onclick="closeSheet()">Закрыть</button>'
  );
}
async function cleanupRooms() {
  const last = localStorage.getItem(LS_LAST_CLEANUP);
  const now = Date.now();
  if (last && now - parseInt(last) < 60 * 60 * 1000) return;
  try {
    await sb.rpc('cleanup_rooms');
    localStorage.setItem(LS_LAST_CLEANUP, now.toString());
  } catch(e) { console.log('Cleanup:', e); }
}
async function loadRooms() {
  try {
    const { data, error } = await sb.from('rooms')
      .select('*')
      .or('is_hidden.eq.false,host_id.eq.' + myId)
      .order('created_at', { ascending: false });
    if (error) { console.error(error); toast('Ошибка: ' + error.message, 'error'); return; }
    rooms = data || [];
    renderRooms();
  } catch (e) { console.error(e); }
  }
  function renderRooms() {
  const area = document.getElementById('roomsArea');
  const empty = document.getElementById('emptyState');
  if (rooms.length === 0) { area.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  if (viewMode === 'bubbles') {
    area.className = 'rooms-bubbles';
    area.innerHTML = rooms.map(r => {
      const days = getDaysLeft(r.expires_at);
      const warning = (days !== null && days <= 3) ? '<div class="bubble-warning">⏱</div>' : '';
      const badge = r.password_hash ? '<div class="bubble-badge">🔒</div>' : (r.is_hidden ? '<div class="bubble-badge">👁</div>' : '');
      return '<div class="room-bubble" onclick="enterRoom(\'' + esc(r.id) + '\')">' +

function generateRoomName(baseName) {
  const base = baseName.trim();
  if (!base) return '';
  const existing = rooms.filter(r => r.name === base || r.name.startsWith(base + ' '));
  if (existing.length === 0) return base;
  let maxNum = 1;
  existing.forEach(r => {
    if (r.name === base) maxNum = Math.max(maxNum, 1);
    else {
      const m = r.name.match(new RegExp('^' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ' (\\d+)$'));
      if (m) maxNum = Math.max(maxNum, parseInt(m[1]));
    }
  });
  return base + ' ' + (maxNum + 1);
  }

  function parseVideoUrl(url) {
  if (!url) return null;
  url = url.trim();
  if (!url.match(/^https?:\/\//i)) return null;
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if (yt) return { type: 'invidious', videoId: yt[1], src: currentInvidious + '/embed/' + yt[1], embeddable: true };
  const rt = url.match(/rutube\.ru\/(?:video|play\/embed|live)\/([a-zA-Z0-9]+)/);
  if (rt) return { type: 'iframe', src: 'https://rutube.ru/play/embed/' + rt[1], embeddable: true, nosync: true };
  const vk = url.match(/(?:vk\.com|vkvideo\.ru)\/video(-?\d+)_(\d+)/);
  if (vk) return { type: 'iframe', src: 'https://vk.com/video_ext.php?oid=' + vk[1] + '&id=' + vk[2] + '&autoplay=0', embeddable: true, nosync: true };
  const dm = url.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/);
  if (dm) return { type: 'iframe', src: 'https://www.dailymotion.com/embed/video/' + dm[1], embeddable: true, nosync: true };
  const vm = url.match(/vimeo\.com\/(\d+)/);
  if (vm) return { type: 'iframe', src: 'https://player.vimeo.com/video/' + vm[1], embeddable: true, nosync: true };
  const twCh = url.match(/twitch\.tv\/([a-zA-Z0-9_]+)$/);
  if (twCh) return { type: 'iframe', src: 'https://player.twitch.tv/?channel=' + twCh[1] + '&parent=' + window.location.hostname, embeddable: true, nosync: true };
  const ok = url.match(/ok\.ru\/video\/(\d+)/);
  if (ok) return { type: 'iframe', src: 'https://ok.ru/videoembed/' + ok[1], embeddable: true, nosync: true };
  const tg = url.match(/t\.me\/([a-zA-Z0-9_]+)\/(\d+)/);
  if (tg) return { type: 'iframe', src: 'https://t.me/' + tg[1] + '/' + tg[2] + '?embed=1', embeddable: true, nosync: true };
  if (url.match(/\.(mp4|webm|ogg|mov|m4v)(\?|$)/i)) return { type: 'html5', src: url, embeddable: true };
  if (url.match(/\.m3u8(\?|$)/i)) return { type: 'hls', src: url, embeddable: true };
  return { type: 'iframe', src: url, embeddable: false, nosync: true };
}

  const hostTimeEl = document.getElementById('hostTime');
  if (hostTimeEl && !isHost && s.time !== undefined) {
    const total = Math.floor(s.time);
    const m = Math.floor(total / 60);
    const sec = total % 60;
    hostTimeEl.innerHTML = '🎬 Хост: ' + m + ':' + sec.toString().padStart(2, '0') + (s.playing ? ' ▶' : ' ⏸');
  }
  suppressSync = true;
  const v = document.getElementById('videoPlayer');
  if (v && v.tagName === 'VIDEO') {
    const targetTime = (s.time || 0) + ((Date.now() - s.updated) / 1000);
    if (Math.abs(v.currentTime - targetTime) > 3) v.currentTime = targetTime;
    if (s.playing && v.paused) v.play().catch(()=>{});
    if (!s.playing && !v.paused) v.pause();

    renderRoom();
    loadRooms();
  } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
}
async function deleteRoom() {
  if (!currentRoom) return;
  if (!confirm('Удалить комнату «' + currentRoom.name + '»?\n\nВся история удалится навсегда.')) return;
  try {
    await sb.from('user_activity').delete().eq('room_id', currentRoom.id);
    await sb.from('direct_messages').delete().eq('room_id', currentRoom.id);
    await sb.from('room_messages').delete().eq('room_id', currentRoom.id);
    await sb.from('rooms').delete().eq('id', currentRoom.id);
    toast('Комната удалена', 'success');
    if (roomChannel) { sb.removeChannel(roomChannel); roomChannel = null; }
    if (syncInterval) { clearInterval(syncInterval); syncInterval = null; }
    currentRoom = null;
    currentRoomMessages = [];
    await loadRooms();
    showScreen('home');
  } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
}
function getExtendButtonHtml(r) {
  if (!r.expires_at) return '';
  const daysLeft = Math.ceil((new Date(r.expires_at) - new Date()) / (1000 * 60 * 60 * 24));
  if (daysLeft <= 2) {
    return '<button class="btn small primary" onclick="extendRoom()" style="padding:6px 10px; min-height:34px; font-size:12px; margin:0;">⏱ Продлить! ' + daysLeft + ' дн.</button>';
  }
  return '<button class="btn small ghost" disabled style="padding:6px 10px; min-height:34px; font-size:12px; margin:0; opacity:0.5;">⏱ ' + daysLeft + ' дн.</button>';
}
function copyShareLink() {
  const url = window.location.origin + window.location.pathname + '?room=' + currentRoom.id + (currentRoom.invite_code ? '&invite=' + currentRoom.invite_code : '');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => toast('Скопировано', 'success')).catch(() => fallbackCopy(url));
  } else fallbackCopy(url);
}
function fallbackCopy(text) {
  const t = document.createElement('textarea');
  t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); toast('Скопировано', 'success'); } catch(e) { toast('Не удалось', 'error'); }
  t.remove();
}
async function loadRoomMessages(roomId) {
  try {
    const { data, error } = await sb.from('room_messages').select('*').eq('room_id', roomId).eq('hidden', false).order('created_at', { ascending: true }).limit(200);
    if (error) { console.error(error); return; }
    currentRoomMessages = data || [];
    renderMessages();
  } catch (e) { console.error(e); }
}
function renderMessages() {
  const box = document.getElementById('chatMessages');
  if (!box) return;
  if (currentRoomMessages.length === 0) { box.innerHTML = '<div class="hidden-note">Пока тихо. Напиши первым 👋</div>'; return; }
  box.innerHTML = currentRoomMessages.map(m => {
    const time = new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const isMine = m.user_id === myId;
    const actions = '<div class="chat-msg-actions">' +
      (isMine ? '' : '<button class="chat-msg-btn dm" onclick="openDM(\'' + m.user_id + '\', \'' + esc(m.name) + '\')" title="ЛС">💬</button>') +
      (isMine ? '' : '<button class="chat-msg-btn" onclick="hideMessage(' + m.id + ')" title="Скрыть">👁🚫</button>') +
      '</div>';
    return '<div class="chat-msg">' +
      '<div class="chat-msg-avatar">' + (m.avatar || '👤') + '</div>' +
      '<div class="chat-msg-body">' +
        '<div class="chat-msg-name">' + esc(m.name) + '</div>' +
        '<div class="chat-msg-text">' + esc(m.text) + '</div>' +
        '<div class="chat-msg-time">' + time + '</div>' +
      '</div>' + actions + '</div>';
  }).join('');
  box.scrollTop = box.scrollHeight;
}
async function sendMessage() {
  const inp = document.getElementById('chatInput');
  if (!inp) return;
  const text = inp.value.trim();
  if (!text) return;
  let name = localStorage.getItem(LS_MY_NAME);
  let avatar = localStorage.getItem(LS_MY_AVATAR);
  if (!name) {
    name = prompt('Как тебя зовут?');
    if (!name) return;
    name = name.trim().slice(0, 20);
    avatar = prompt('Аватар (эмодзи)?', '👤') || '👤';
    localStorage.setItem(LS_MY_NAME, name);
    localStorage.setItem(LS_MY_AVATAR, avatar.slice(0, 4));
  }
  inp.value = '';
  const { error } = await sb.from('room_messages').insert({
    room_id: currentRoom.id, name: name, avatar: avatar, text: text, user_id: myId, hidden: false
  });
  if (error) { toast('Ошибка: ' + error.message, 'error'); return; }
  await logActivity('message');
  await loadRoomMessages(currentRoom.id);
}
async function hideMessage(msgId) {
  try {
    await sb.from('message_hides').insert({ message_id: msgId, user_id: myId });
    const { data } = await sb.from('message_hides').select('*').eq('message_id', msgId);
    const count = (data || []).length;
    if (count >= 3) {
      await sb.from('room_messages').update({ hidden: true }).eq('id', msgId);
      toast('Скрыто у всех (3+ жалоб)', 'success');
    } else toast('Скрыто у тебя (' + count + '/3)');
    await loadRoomMessages(currentRoom.id);
  } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
}
async function openDM(userId, userName) {
  if (userId === myId) return toast('Это ты');
  const { data } = await sb.from('direct_messages').select('*')
    .eq('room_id', currentRoom.id)
    .or('and(from_user_id.eq.' + myId + ',to_user_id.eq.' + userId + '),and(from_user_id.eq.' + userId + ',to_user_id.eq.' + myId + ')')
    .order('created_at', { ascending: true });
  const messagesHtml = (data || []).map(m => {
    const mine = m.from_user_id === myId;
    return '<div class="dm-msg ' + (mine ? 'mine' : 'their') + '">' + esc(m.text) + '<div class="dm-time">' + new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + '</div></div>';
  }).join('');
  openSheet(
    '<h2>💬 ' + esc(userName) + '</h2>' +
    '<div class="dm-box">' +
      '<div class="dm-messages" id="dmMessages">' + (messagesHtml || '<div class="hidden-note">Начни переписку 👋</div>') + '</div>' +
      '<div class="chat-input-row">' +
        '<input id="dmInput" class="input" placeholder="Сообщение...">' +
        '<button class="btn primary small" onclick="sendDM(\'' + userId + '\', \'' + esc(userName) + '\')">➤</button>' +
      '</div>' +
    '</div>' +
    '<button class="btn ghost block" onclick="closeSheet()">Закрыть</button>'
  );
  setTimeout(() => {
    const box = document.getElementById('dmMessages');
    if (box) box.scrollTop = box.scrollHeight;
    const inp = document.getElementById('dmInput');
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') sendDM(userId, userName); });
  }, 100);
}
async function sendDM(userId, userName) {
  const inp = document.getElementById('dmInput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  const name = localStorage.getItem(LS_MY_NAME) || 'Гость';
  await sb.from('direct_messages').insert({
    room_id: currentRoom.id, from_user_id: myId, to_user_id: userId,
    from_name: name, to_name: userName, text: text
  });
  openDM(userId, userName);
  }
  sb.channel('rooms-list')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => loadRooms())
  .subscribe();

(async function init() {
  document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('active', b.dataset.view === viewMode));
  await cleanupRooms();
  await loadRooms();
  const params = new URLSearchParams(window.location.search);
  const roomParam = params.get('room');
  const inviteParam = params.get('invite');
  if (roomParam) {
    if (rooms.find(r => r.id === roomParam)) enterRoom(roomParam, inviteParam);
    else toast('Комната не найдена', 'error');
  }
})();
</script>
