<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
  :root {
    --bg: #101018; --surface: #191924; --surface-2: #21212e;
    --border: #2a2a38; --text: #ebeaf2; --text-2: #a8a8b8; --text-3: #6e6e82;
    --accent: #6f52e8; --danger: #e05563; --success: #4a9e6e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; overflow-x: hidden; min-height: 100vh; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; }
  .app-header { position: sticky; top: 0; z-index: 50; background: rgba(16,16,24,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .logo { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; }
  .logo span { font-size: 20px; }
  .header-actions { display: flex; align-items: center; gap: 6px; }
  .view-toggle { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  .view-toggle button { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 15px; border-radius: 6px; color: var(--text-2); }
  .view-toggle button.active { background: var(--accent); color: #fff; }
  .help-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: var(--text-2); flex-shrink: 0; }
  .screen { display: none; padding: 14px; max-width: 1000px; margin: 0 auto; }
  .screen.active { display: block; }
  .title-block { text-align: center; padding: 24px 16px 16px; }
  .title-block h1 { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
  .title-block p { font-size: 14px; color: var(--text-2); }
  .rooms-bubbles { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; padding: 16px 0 100px; }
  .room-bubble { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; width: 130px; }
  .bubble-circle { width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 52px; background: var(--surface); position: relative; }
  .bubble-badge { position: absolute; bottom: 4px; right: 4px; font-size: 18px; background: rgba(0,0,0,0.7); border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .bubble-name { font-size: 13px; font-weight: 700; text-align: center; word-wrap: break-word; line-height: 1.2; max-width: 130px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .rooms-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; padding: 16px 0 100px; }
  .room-tile { aspect-ratio: 1; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px; cursor: pointer; overflow: hidden; color: #fff; text-align: center; position: relative; }
  .room-tile-avatar { font-size: 38px; }
  .room-tile-name { font-size: 12px; font-weight: 700; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .room-tile-badge { position: absolute; bottom: 4px; right: 4px; font-size: 14px; background: rgba(0,0,0,0.7); border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
  .empty-state { text-align: center; padding: 60px 30px; color: var(--text-2); }
  .empty-state .big-icon { font-size: 64px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state h2 { font-size: 17px; margin-bottom: 6px; font-weight: 700; }
  .empty-state p { font-size: 14px; }
  .fab-center { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: 68px; height: 68px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 30px; display: flex; align-items: center; justify-content: center; z-index: 60; }
  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--surface); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; border-top: 1px solid var(--border); padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 90vh; overflow-y: auto; }
  .sheet::before { content: ''; display: block; width: 44px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 14px; }
  .sheet h2 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .sheet .sub { font-size: 13px; color: var(--text-2); margin-bottom: 14px; }
  .field-label { display: block; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 5px; margin-top: 12px; }
  .input, .select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 11px 13px; border-radius: 10px; font-size: 15px; margin-bottom: 8px; }
  .select { appearance: none; }
  .input:focus, .select:focus { outline: none; border-color: var(--accent); }
  .avatar-picker, .color-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .avatar-option { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .avatar-option.selected { border: 2px solid var(--accent); transform: scale(1.08); }
  .color-option { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer; }
  .color-option.selected { border: 3px solid var(--text); transform: scale(1.08); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 18px; border-radius: 10px; font-size: 15px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); min-height: 46px; width: 100%; margin-top: 6px; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.ghost { background: transparent; }
  .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn.small { width: auto; padding: 7px 11px; min-height: 34px; font-size: 13px; margin: 0; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .room-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: nowrap; }
  .back-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); font-size: 17px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-2); }
  .room-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .room-info-avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .room-info-text { flex: 1; min-width: 0; overflow: hidden; }
  .room-info-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room-info-meta { font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .host-time { font-size: 11px; color: var(--accent); margin-top: 2px; font-weight: 700; }
  .room-buttons { display: flex; gap: 5px; flex-shrink: 0; align-items: center; }
  .video-box { background: #000; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; position: relative; }
  .video-box iframe, .video-box video { width: 100%; height: 100%; border: none; }
  .video-placeholder { color: #666; text-align: center; padding: 20px; font-size: 14px; }
  .video-placeholder .big-icon { font-size: 52px; margin-bottom: 8px; }
  .countdown-overlay { display: none; position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; font-size: 110px; font-weight: 900; color: #fff; text-shadow: 0 0 40px rgba(111,82,232,0.8); }
  .play-overlay { display: none; position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; flex-direction: column; gap: 12px; pointer-events: none; }
  .play-overlay .arrow { font-size: 70px; }
  .play-overlay .text { font-size: 22px; font-weight: 800; color: #fff; }
  .share-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .share-box-text { flex: 1; min-width: 140px; font-size: 12px; color: var(--text-2); word-break: break-all; }
  .share-box-text b { color: var(--text); }
  .chat-block { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .chat-title { font-size: 11px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .chat-messages { max-height: 400px; overflow-y: auto; margin-bottom: 8px; }
  .chat-msg { padding: 9px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-start; }
  .chat-msg:last-child { border-bottom: none; }
  .chat-msg-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; background: var(--surface-2); }
  .chat-msg-body { flex: 1; min-width: 0; }
  .chat-msg-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .chat-msg-text { font-size: 14px; word-wrap: break-word; }
  .chat-msg-time { font-size: 10px; color: var(--text-3); margin-top: 3px; }
  .chat-msg-actions { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
  .chat-msg-btn { background: none; border: none; color: var(--text-3); font-size: 14px; padding: 3px; cursor: pointer; }
  .chat-input-row { display: flex; gap: 6px; }
  .chat-input-row input { margin-bottom: 0; flex: 1; }
  .chat-input-row .btn { width: auto; padding: 11px 16px; margin: 0; min-height: 44px; }
  .dm-box { display: flex; flex-direction: column; height: 50vh; min-height: 280px; }
  .dm-messages { flex: 1; overflow-y: auto; padding: 8px; background: var(--bg); border-radius: 10px; margin-bottom: 8px; }
  .dm-msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; margin-bottom: 6px; font-size: 14px; word-wrap: break-word; }
  .dm-msg.mine { background: var(--accent); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .dm-msg.their { background: var(--surface-2); color: var(--text); margin-right: auto; border-bottom-left-radius: 4px; }
  .dm-time { font-size: 10px; opacity: 0.6; margin-top: 3px; }
  .toast-root { position: fixed; left: 0; right: 0; bottom: 110px; z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .toast { background: var(--surface-2); color: var(--text); padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; max-width: 90%; border: 1px solid var(--border); }
  .toast.error { background: var(--danger); color: #fff; }
  .toast.success { background: var(--success); color: #fff; }
  .help-content { font-size: 14px; line-height: 1.7; color: var(--text-2); }
  .help-content h3 { font-size: 15px; color: var(--text); margin: 14px 0 6px; font-weight: 800; }
  .help-content .tip { background: var(--surface-2); border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 6px; margin: 8px 0; font-size: 13px; }
  .hidden-note { font-size: 12px; color: var(--text-3); font-style: italic; padding: 8px; text-align: center; }
</style>
</head>
<body>

<button class="fab-center" id="fabCreate" onclick="openCreateRoom()">🎬</button>
<div id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script>
const SUPABASE_URL = 'https://aritoekxhdmskwiejqve.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyaXRvZWt4aGRtc2t3aWVqcXZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MDA3MjAsImV4cCI6MjEwNzA3NjcyMH0.smtTA67icGqn0vD9fbDzyc8bdKqz_O-b7D1M3bgSqm4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const LS_MY_ID = 'smotrim_my_id';
const LS_MY_NAME = 'smotrim_my_name';
const LS_MY_AVATAR = 'smotrim_my_avatar';
const LS_VIEW = 'smotrim_view';
const LS_LAST_CLEANUP = 'smotrim_last_cleanup';
const LS_INVIDIOUS = 'smotrim_invidious';

const INVIDIOUS_INSTANCES = [
  'https://inv.nadeko.net',
  'https://invidious.nerdvpn.de',
  'https://invidious.tiekoetter.com',
  'https://invidious.f5.si',
  'https://yewtu.be'
];

let currentInvidious = localStorage.getItem(LS_INVIDIOUS) || INVIDIOUS_INSTANCES[0];

let myId = localStorage.getItem(LS_MY_ID);
if (!myId) { myId = 'u_' + Math.random().toString(36).slice(2, 10); localStorage.setItem(LS_MY_ID, myId); }

const AVATARS = ['🎬','🍿','🎥','📺','🎭','🎨','🌟','🌙','☀️','🔥','💎','🎪','🎯','🎲','🎸','🎤','📷','🎮','🚀','🌈'];
const COLORS = ['#ff6b9d','#ffa06b','#ffd93d','#6bcf7f','#6bc5ff','#a06bff','#ff6b6b','#5eead4','#f472b6','#93c5fd','#fcd34d','#86efac'];

let rooms = [];
let currentRoom = null;
let currentRoomMessages = [];
let viewMode = localStorage.getItem(LS_VIEW) || 'bubbles';
let selectedAvatar = AVATARS[0];
let selectedColor = COLORS[0];
let roomChannel = null;
let ytPlayer = null;
let ytPlayerReady = false;
let suppressSync = false;
let syncInterval = null;
let countdownInterval = null;
let isHost = false;

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, type) {
  const r = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  r.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); }, 3000);
}
function openSheet(html) { document.getElementById('modalRoot').innerHTML = '<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet">' + html + '</div></div>'; }
function closeSheet() { document.getElementById('modalRoot').innerHTML = ''; }
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.getElementById('fabCreate').style.display = name === 'home' ? 'flex' : 'none';
  window.scrollTo(0, 0);
}
function setView(v) {
  viewMode = v;
  localStorage.setItem(LS_VIEW, v);
  document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  renderRooms();
}
function getDaysLeft(expiresAt) {
  if (!expiresAt) return null;
  return Math.max(0, Math.ceil((new Date(expiresAt) - new Date()) / (1000 * 60 * 60 * 24)));
}
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function generateInviteCode() { return 'inv_' + Math.random().toString(36).slice(2, 12); }

function openHelp() {
  openSheet(
    '<h2>📖 Как пользоваться</h2><div class="help-content">' +
    '<h3>🎬 Комната</h3><p>Нажми 🎬 внизу. Живёт 10 дней. Хост может продлить ⏱.</p>' +
    '<h3>📺 Видео</h3><p>Хост выбирает видео через 📺. YouTube идёт через Invidious (обход блокировки).</p>' +
    '<h3>⏱ Счётчик</h3><p>15 секунд перед стартом.</p>' +
    '<h3>🔄 Синхрон</h3><p>YouTube и .mp4 — синхрон. VK/RuTube — «Нажми Play».</p>' +
    '<h3>🌐 Сервер</h3><p>Не грузится YouTube — нажми 🌐 и смени сервер.</p>' +
    '<h3>💬 ЛС</h3><p>Нажми 💬 рядом с сообщением — откроется личная переписка.</p>' +
    '</div><button class="btn ghost" style="margin-top:16px;" onclick="closeSheet()">Закрыть</button>'
  );
}
async function cleanupRooms() {
  const last = localStorage.getItem(LS_LAST_CLEANUP);
  const now = Date.now();
  if (last && now - parseInt(last) < 60 * 60 * 1000) return;
  try { await sb.rpc('cleanup_rooms'); localStorage.setItem(LS_LAST_CLEANUP, now.toString()); } catch(e) {}
}
async function loadRooms() {
  try {
    const { data, error } = await sb.from('rooms').select('*').order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    rooms = data || [];
    renderRooms();
  } catch (e) { console.error(e); }
}
function renderRooms() {
  const area = document.getElementById('roomsArea');
  const empty = document.getElementById('emptyState');
  const visible = rooms.filter(r => !r.is_hidden || r.host_id === myId);
  if (visible.length === 0) { area.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  if (viewMode === 'bubbles') {
    area.className = 'rooms-bubbles';
    area.innerHTML = visible.map(r => {
      const days = getDaysLeft(r.expires_at);
      const warning = (days !== null && days <= 3) ? '<div class="bubble-badge">⏱</div>' : '';
      const badge = r.password_hash ? '<div class="bubble-badge">🔒</div>' : (r.is_hidden ? '<div class="bubble-badge">👁</div>' : '');
      return '<div class="room-bubble" onclick="enterRoom(\'' + esc(r.id) + '\')">' +
        '<div class="bubble-circle" style="background:' + esc(r.color || '#6f52e8') + ';">' + (r.avatar || '🎬') + warning + badge + '</div>' +
        '<div class="bubble-name">' + esc(r.name) + '</div></div>';
    }).join('');
  } else {
    area.className = 'rooms-tiles';
    area.innerHTML = visible.map(r => {
      const days = getDaysLeft(r.expires_at);
      const warning = (days !== null && days <= 3) ? '<div class="room-tile-badge">⏱</div>' : '';
      const badge = r.password_hash ? '<div class="room-tile-badge">🔒</div>' : (r.is_hidden ? '<div class="room-tile-badge">👁</div>' : '');
      return '<div class="room-tile" style="background:' + esc(r.color || '#6f52e8') + ';" onclick="enterRoom(\'' + esc(r.id) + '\')">' +
        warning + badge +
        '<div class="room-tile-avatar">' + (r.avatar || '🎬') + '</div>' +
        '<div class="room-tile-name">' + esc(r.name) + '</div></div>';
    }).join('');
  }
}
function generateRoomName(baseName) {
  const base = baseName.trim();
  if (!base) return '';
  const existing = rooms.filter(r => r.name === base || r.name.startsWith(base + ' '));
  if (existing.length === 0) return base;
  let maxNum = 1;
  existing.forEach(r => {
    if (r.name === base) maxNum = Math.max(maxNum, 1);
    else {
      const m = r.name.match(new RegExp('^' + base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ' (\\d+)$'));
      if (m) maxNum = Math.max(maxNum, parseInt(m[1]));
    }
  });
  return base + ' ' + (maxNum + 1);
}
function openCreateRoom() {
  selectedAvatar = AVATARS[Math.floor(Math.random() * AVATARS.length)];
  selectedColor = COLORS[Math.floor(Math.random() * COLORS.length)];
  const avatarsHtml = AVATARS.map(a => '<button class="avatar-option ' + (a === selectedAvatar ? 'selected' : '') + '" data-av="' + a + '" onclick="selectAvatar(\'' + a + '\')">' + a + '</button>').join('');

async function createRoom() {

  if (!rawName) return toast('Введи название', 'error');
  const privacy = document.getElementById('roomPrivacy').value;
  const password = document.getElementById('roomPassword').value.trim();
  if (privacy === 'password' && !password) return toast('Введи пароль', 'error');
  const finalName = generateRoomName(rawName);
  const roomId = 'room_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const expiresAt = new Date();
  expiresAt.setDate(expiresAt.getDate() + 10);
  const isHidden = privacy === 'hidden' || privacy === 'password';
  const passwordHash = password ? await sha256(password) : null;
  const inviteCode = isHidden ? generateInviteCode() : null;
  const { error } = await sb.from('rooms').insert({
    id: roomId, name: finalName, avatar: selectedAvatar, color: selectedColor,
    host_id: myId, video_url: null, sync_state: {},

  });
  if (error) { toast('Ошибка: ' + error.message, 'error'); return; }
  closeSheet();

}

function parseVideoUrl(url) {
  if (!url) return null;
  url = url.trim();
  if (!url.match(/^https?:\/\//i)) return null;
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if (yt) return { type: 'invidious', videoId: yt[1], src: currentInvidious + '/embed/' + yt[1], embeddable: true };
  const rt = url.match(/rutube\.ru\/(?:video|play\/embed|live)\/([a-zA-Z0-9]+)/);
  if (rt) return { type: 'iframe', src: 'https://rutube.ru/play/embed/' + rt[1], embeddable: true, nosync: true };
  const vk = url.match(/(?:vk\.com|vkvideo\.ru)\/video(-?\d+)_(\d+)/);
  if (vk) return { type: 'iframe', src: 'https://vk.com/video_ext.php?oid=' + vk[1] + '&id=' + vk[2], embeddable: true, nosync: true };
  if (url.match(/\.(mp4|webm|ogg|mov|m4v)(\?|$)/i)) return { type: 'html5', src: url, embeddable: true };
  if (url.match(/\.m3u8(\?|$)/i)) return { type: 'hls', src: url, embeddable: true };
  return { type: 'iframe', src: url, embeddable: false, nosync: true };
}

async function enterRoom(roomId, inviteCode) {
  let room = rooms.find(r => r.id === roomId);
  if (!room) {
    const { data } = await sb.from('rooms').select('*').eq('id', roomId).limit(1);
    if (!data || data.length === 0) return toast('Комната не найдена', 'error');
    room = data[0];
    if (!rooms.find(r => r.id === roomId)) rooms.push(room);
  }
  if (room.password_hash) {
    const savedPass = sessionStorage.getItem('room_pass_' + roomId);
    if (!savedPass) {
      const pass = prompt('🔒 Пароль комнаты:');
      if (!pass) return;
      const hash = await sha256(pass);
      if (hash !== room.password_hash) return toast('Неверный пароль', 'error');
      sessionStorage.setItem('room_pass_' + roomId, hash);
    }
  }
  if (room.invite_code && room.host_id !== myId) {
    const params = new URLSearchParams(window.location.search);
    const urlInvite = params.get('invite');
    const savedInvite = sessionStorage.getItem('room_invite_' + roomId);
    if (urlInvite === room.invite_code) {
      sessionStorage.setItem('room_invite_' + roomId, '1');
    } else if (savedInvite !== '1') {
      const entered = prompt('🔗 Код приглашения:');
      if (entered !== room.invite_code) return toast('Неверный код', 'error');
      sessionStorage.setItem('room_invite_' + roomId, '1');
    }
  }
  currentRoom = room;
  isHost = (room.host_id === myId);
  const days = getDaysLeft(room.expires_at);
  if (isHost && days !== null && days <= 3) setTimeout(() => toast('⚠️ Удаление через ' + days + ' дн.', 'error'), 500);
  showScreen('room');
  renderRoom();
  await loadRoomMessages(roomId);
  if (roomChannel) sb.removeChannel(roomChannel);
  roomChannel = sb.channel('room-' + roomId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'room_messages', filter: 'room_id=eq.' + roomId }, () => loadRoomMessages(roomId))
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: 'id=eq.' + roomId }, payload => {
      if (currentRoom && currentRoom.id === roomId) {
        const oldVideo = currentRoom.video_url;
        currentRoom = payload.new;
        if (oldVideo !== payload.new.video_url) renderRoom();
        else if (!isHost) {
          const vd = parseVideoUrl(currentRoom.video_url);
          if (vd && !vd.nosync) applySyncState();
        }
      }
    })
    .subscribe();
  if (room.countdown_start) {
    const diff = Math.ceil((new Date(room.countdown_start).getTime() - Date.now()) / 1000);
    if (diff > 0) startCountdown();
    else if (diff > -20) {
      const p = document.getElementById('playOverlay');
      if (p) { p.style.display = 'flex'; setTimeout(() => p.style.display = 'none', 3000); }
    }
  }
}

function startCountdown() {
  if (countdownInterval) clearInterval(countdownInterval);
  const overlay = document.getElementById('countdownOverlay');
  if (!overlay) return;
  countdownInterval = setInterval(() => {
    const startTime = new Date(currentRoom.countdown_start).getTime();
    const diff = Math.ceil((startTime - Date.now()) / 1000);
    if (diff > 0) {
      overlay.textContent = diff;
      overlay.style.display = 'flex';
    } else {
      overlay.style.display = 'none';
      clearInterval(countdownInterval);
      countdownInterval = null;
      handleStart();
    }
  }, 100);
}
function handleStart() {
  const vd = parseVideoUrl(currentRoom.video_url);
  if (!vd) return;
  if (vd.type === 'html5' || vd.type === 'hls') {
    const v = document.getElementById('videoPlayer');
    if (v && v.tagName === 'VIDEO') { v.currentTime = 0; v.play().catch(() => showPlayOverlay()); }
    return;
  }
  showPlayOverlay();
}
function showPlayOverlay() {

function initHtml5Sync() {
  const v = document.getElementById('videoPlayer');
  if (!v) return;
  v.addEventListener('play', () => { if (!suppressSync) updateSync({ playing: true, time: v.currentTime }); });
  v.addEventListener('pause', () => { if (!suppressSync) updateSync({ playing: false, time: v.currentTime }); });
  v.addEventListener('seeked', () => { if (!suppressSync) updateSync({ playing: !v.paused, time: v.currentTime, seek: true }); });
}
function initHls() {
  const v = document.getElementById('videoPlayer');
  if (!v || !currentRoom) return;
  if (window.Hls && window.Hls.isSupported()) {
    const hls = new window.Hls();
    hls.loadSource(currentRoom.video_url);
    hls.attachMedia(v);
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = currentRoom.video_url;
  }
}
async function updateSync(data) {
  if (!currentRoom) return;
  const state = Object.assign({}, currentRoom.sync_state || {}, data);
  state.updated = Date.now();
  await sb.from('rooms').update({ sync_state: state }).eq('id', currentRoom.id);
}
function applySyncState() {
  if (!currentRoom || !currentRoom.sync_state) return;
  const s = currentRoom.sync_state;
  if (!s.updated || Date.now() - s.updated > 20000) return;
  const hostTimeEl = document.getElementById('hostTime');
  if (hostTimeEl && !isHost && s.time !== undefined) {
    const total = Math.floor(s.time);
    const m = Math.floor(total / 60);
    const sec = total % 60;
    hostTimeEl.innerHTML = '🎬 Хост: ' + m + ':' + sec.toString().padStart(2, '0') + (s.playing ? ' ▶' : ' ⏸');
  }
  suppressSync = true;
  const v = document.getElementById('videoPlayer');
  if (v && v.tagName === 'VIDEO') {
    const targetTime = (s.time || 0) + ((Date.now() - s.updated) / 1000);
    if (Math.abs(v.currentTime - targetTime) > 3) v.currentTime = targetTime;
    if (s.playing && v.paused) v.play().catch(()=>{});
    if (!s.playing && !v.paused) v.pause();
  }
  setTimeout(() => { suppressSync = false; }, 500);
}
function startSyncLoop() {
  if (syncInterval) clearInterval(syncInterval);
  syncInterval = setInterval(() => {
    if (!currentRoom) return;
    if (isHost) {
      const v = document.getElementById('videoPlayer');
      if (v && v.tagName === 'VIDEO') updateSync({ playing: !v.paused, time: v.currentTime });
    }
  }, 2000);
}
function leaveRoom() {

    await sb.from('message_hides').insert({ message_id: msgId, user_id: myId });
    const { data } = await sb.from('message_hides').select('*').eq('message_id', msgId);
    const count = (data || []).length;
    if (count >= 3) {
      await sb.from('room_messages').update({ hidden: true }).eq('id', msgId);
      toast('Скрыто у всех');
    } else toast('Скрыто (' + count + '/3)');
    await loadRoomMessages(currentRoom.id);
  } catch (e) { toast('Ошибка: ' + e.message, 'error'); }
}
async function openDM(userId, userName) {
  if (userId === myId) return toast('Это ты');
  const { data } = await sb.from('direct_messages').select('*')
    .eq('room_id', currentRoom.id)
    .order('created_at', { ascending: true });
  const filtered = (data || []).filter(m =>
    (m.from_user_id === myId && m.to_user_id === userId) ||
    (m.from_user_id === userId && m.to_user_id === myId)
  );
  const messagesHtml = filtered.map(m => {
    const mine = m.from_user_id === myId;
    return '<div class="dm-msg ' + (mine ? 'mine' : 'their') + '">' + esc(m.text) + '<div class="dm-time">' + new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + '</div></div>';
  }).join('');
  openSheet(
    '<h2>💬 ' + esc(userName) + '</h2>' +
    '<div class="dm-box">' +
      '<div class="dm-messages" id="dmMessages">' + (messagesHtml || '<div class="hidden-note">Начни переписку 👋</div>') + '</div>' +
      '<div class="chat-input-row">' +
        '<input id="dmInput" class="input" placeholder="Сообщение...">' +
        '<button class="btn primary small" onclick="sendDM(\'' + userId + '\', \'' + esc(userName) + '\')">➤</button>' +
      '</div>' +
    '</div>' +
    '<button class="btn ghost block" onclick="closeSheet()">Закрыть</button>'
  );
  setTimeout(() => {
    const box = document.getElementById('dmMessages');
    if (box) box.scrollTop = box.scrollHeight;
    const inp = document.getElementById('dmInput');
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') sendDM(userId, userName); });
  }, 100);
}
async function sendDM(userId, userName) {
  const inp = document.getElementById('dmInput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  const name = localStorage.getItem(LS_MY_NAME) || 'Гость';
  await sb.from('direct_messages').insert({
    room_id: currentRoom.id, from_user_id: myId, to_user_id: userId,
    from_name: name, to_name: userName, text: text
  });
  openDM(userId, userName);
}

sb.channel('rooms-list')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => loadRooms())
  .subscribe();

(async function init() {
  document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('active', b.dataset.view === viewMode));
  await cleanupRooms();
  await loadRooms();
  const params = new URLSearchParams(window.location.search);
  const roomParam = params.get('room');
  const inviteParam = params.get('invite');
  if (roomParam) enterRoom(roomParam, inviteParam);
})();
</script>
