<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стриминг (Финальный без дублей)</title>
    <style>
        /* =========================================
           БАЗА
           ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #14141c; color: #fff; height: 100vh; overflow: hidden; }

        /* =========================================
           СЕТКА (ПК)
           ========================================= */
        .app-layout {
            display: grid;
            grid-template-columns: 32% 1fr; /* Левая колонка 32%, правая 68% */
            grid-template-rows: 60px 1fr;   /* Верхняя панель 60px, остальное внизу */
            grid-template-areas: 
                "sidebar header" /* ВНИМАНИЕ: На ПК чат и кнопки в одной левой колонке */
                "sidebar main";
            height: 100vh;
            padding: 15px;
            gap: 15px;
        }

        /* =========================================
           ВЕРХНЯЯ ПАНЕЛЬ (ПРОФИЛЬ + КНОПКИ)
           ========================================= */
        /* На ПК это правая колонка (над чатом) */
        .top-bar {
            grid-area: header;
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        /* Плашка Профиля (Слева) */
        .pro-profile {
            background-color: #1e1e28;
            border: 1px solid #333;
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 32%; /* Симметрично правому чату, но так как это grid - можно оставить auto */
            min-width: 150px;
            font-size: 14px;
        }
        .status-dot { width: 8px; height: 8px; background-color: #4ade80; border-radius: 50%; margin-left: auto; }

        /* Контейнер кнопок */
        .nav-buttons {
            display: flex;
            gap: 8px;
            flex: 1;
        }

        .nav-btn {
            background-color: #1e1e28;
            color: #aaa;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            flex: 1;
            transition: 0.2s;
        }
        .nav-btn.active { background-color: #7c3aed; color: #fff; border-color: #7c3aed; }
        #menu-btn { font-weight: bold; background-color: #2a2a35; }

        /* =========================================
           ПЛЕЕР (ПРАВАЯ ЧАСТЬ)
           ========================================= */
        .video-section {
            grid-area: main;
            background-color: #000;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================================
           ЧАТ (ЛЕВАЯ ЧАСТЬ)
           ========================================= */
        .chat-section {
            grid-area: sidebar; /* Занимает левую колонку на ПК */
            display: flex;
            flex-direction: column;
            min-height: 0; /* Важно для скролла */
        }

        .content-window {
            flex: 1;
            background-color: #1e1e28;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { display: flex; gap: 10px; font-size: 14px; }
        .avatar { width: 32px; height: 32px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        
        .chat-input-area { display: flex; padding: 10px; gap: 10px; border-top: 1px solid #333; }
        .chat-input-area input { flex: 1; background: #14141c; border: 1px solid #333; border-radius: 20px; padding: 10px; color: #fff; outline: none; }
        .send-btn { background: #7c3aed; border: none; border-radius: 50%; width: 40px; height: 40px; color: white; cursor: pointer; }

        /* Меню (Вместо чата) */
        .menu-view { display: none; padding: 20px; flex-direction: column; gap: 10px; height: 100%; }
        .menu-item { padding: 15px; background: #2a2a35; border-radius: 8px; cursor: pointer; }

        /* =========================================
           МОБИЛЬНАЯ ВЕРСИЯ (ПЕРЕСТРОЙКА)
           ========================================= */
        @media (max-width: 900px) {
            body { overflow-y: auto; }
            
            /* Сетка на телефоне: 
               1. Плеер (сверху)
               2. Чат (по центру)
               3. Кнопки (внизу)
            */
            .app-layout {
                display: flex;
                flex-direction: column;
                height: 100vh;
                padding: 10px;
                gap: 10px;
            }

            /* Прячем плашку Профиля на телефоне, чтобы не мешала */
            .pro-profile { display: none; }

            /* ПЛЕЕР: Первый элемент */
            .video-section {
                order: 1; 
                min-height: 200px;
                flex-shrink: 0;
            }

            /* ЧАТ: Второй элемент */
            .chat-section {
                order: 2;
                flex: 1; /* Занимает всё оставшееся место */
                min-height: 300px;
                margin-bottom: 70px; /* Отступ под кнопки, чтобы не перекрывали ввод */
            }

            /* КНОПКИ: Третий элемент (Внизу) */
            /* Мы берем шапку и делаем из нее нижнюю панель */
            .top-bar {
                order: 3;
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: #14141c;
                padding: 10px;
                border-top: 1px solid #333;
                z-index: 100;
                margin: 0;
            }

            .nav-buttons {
                width: 100%;
                justify-content: space-between;
                gap: 4px;
            }

            .nav-btn {
                font-size: 11px;
                padding: 8px 4px;
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <!-- ЕДИНЫЙ КОНТЕЙНЕР -->
    <div class="app-layout">
        
        <!-- ШАПКА (На ПК это правая колонка с кнопками) -->
        <header class="top-bar">
            <div class="pro-profile">
                <span>Про</span>
                <span style="color: #888; font-size: 12px;">10дн</span>
                <div class="status-dot"></div>
                <span>2</span>
                <button style="background:none; border:none; color:#888; cursor:pointer;">⚙️</button>
            </div>

            <!-- Единственный экземпляр кнопок -->
            <div class="nav-buttons">
                <button class="nav-btn active" onclick="switchTab('home', this)">Главная</button>
                <button class="nav-btn" onclick="switchTab('general', this)">Общее</button>
                <button class="nav-btn" onclick="switchTab('custom', this)">Своё</button>
                <button class="nav-btn" onclick="switchTab('people', this)">Люди</button>
                <button class="nav-btn" onclick="switchTab('invite', this)">Пригласить</button>
                <button class="nav-btn" id="menu-btn" onclick="toggleMenu(this)">Меню</button>
            </div>
        </header>

        <!-- ПЛЕЕР (Единственный экземпляр) -->
        <section class="video-section">
            <div style="text-align: center; color: #666;">
                <div style="font-size: 48px; margin-bottom: 10px;">📺</div>
                <h2 style="color: #ccc; font-size: 18px;">Тут будет видео</h2>
                <p style="font-size: 14px;">Хост ещё не выбрал</p>
            </div>
        </section>

        <!-- ЧАТ (Единственный экземпляр) -->
        <aside class="chat-section">
            <div class="content-window">
                <div class="chat-view" id="chat-view" style="display: flex; flex-direction: column; height: 100%;">
                    <div class="chat-messages">
                        <div class="message">
                            <div class="avatar">АК</div>
                            <div>
                                <div style="font-weight: bold; margin-bottom: 2px;">ак</div>
                                <div style="color: #ccc;">Просто</div>
                            </div>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" placeholder="Сообщение...">
                        <button class="send-btn">➤</button>
                    </div>
                </div>

                <div class="menu-view" id="menu-view">
                    <h3>Меню</h3>
                    <div class="menu-item">⚙️ Настройки</div>
                    <div class="menu-item">🔔 Уведомления</div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // Логика переключения (без дублей DOM)
        const chatView = document.getElementById('chat-view');
        const menuView = document.getElementById('menu-view');
        const navButtons = document.querySelectorAll('.nav-btn');

        function switchTab(tabName, btnElement) {
            navButtons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            chatView.style.display = 'flex';
            menuView.style.display = 'none';
        }

        function toggleMenu(btnElement) {
            navButtons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            chatView.style.display = 'none';
            menuView.style.display = 'flex';
        }
    </script>
</body>
</html>
