<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стриминговая платформа</title>
    <style>
        /* =========================================
           БАЗОВЫЕ СТИЛИ И СБРОС
           ========================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #14141c;
            color: #ffffff;
            height: 100vh;
            overflow: hidden; /* Запрещаем скролл всего body */
            display: flex;
            flex-direction: column;
        }

        /* =========================================
           ВЕРХНЯЯ ПАНЕЛЬ (Профиль)
           ========================================= */
        .top-bar {
            display: flex;
            padding: 10px 20px;
            height: 60px;
            align-items: center;
        }

        .pro-profile {
            background-color: #1e1e28;
            border: 1px solid #333;
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            /* Ширина симметрична правой панели (примерно 30-35%) */
            width: 32%;
            max-width: 400px;
            font-size: 14px;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            margin-left: auto;
            margin-right: 10px;
        }

        .settings-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 16px;
        }

        /* =========================================
           ОСНОВНАЯ РАБОЧАЯ ОБЛАСТЬ
           ========================================= */
        .main-content {
            display: flex;
            flex: 1;
            padding: 0 20px 20px 20px;
            gap: 20px;
            min-height: 0; /* Важно для работы скролла внутри чата */
        }

        /* --- ЛЕВАЯ ЧАСТЬ: Плеер --- */
        .video-section {
            flex: 1; /* Растягивается на всё свободное место */
            background-color: #000000;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .video-placeholder {
            text-align: center;
            color: #666;
        }

        .video-placeholder .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .video-placeholder h2 {
            color: #ccc;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .video-placeholder p {
            font-size: 14px;
        }

        /* --- ПРАВАЯ ЧАСТЬ: Кнопки и Чат --- */
        .sidebar-section {
            /* Ширина симметрична верхней панели */
            width: 32%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 0;
        }

        /* --- Кнопки меню (Над чатом) --- */
        .nav-buttons {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }

        .nav-btn {
            flex: 1;
            background-color: #1e1e28;
            color: #aaa;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px 5px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-btn:hover {
            background-color: #2a2a35;
            color: #fff;
        }

        .nav-btn.active {
            background-color: #7c3aed; /* Фиолетовый */
            color: #fff;
            border-color: #7c3aed;
        }

        /* Специальный стиль для кнопки "Меню" */
        #menu-btn {
            flex: 0.8; /* Чуть уже остальных */
            font-weight: bold;
            background-color: #2a2a35;
        }

        /* --- Окно контента (Чат или Меню) --- */
        .content-window {
            flex: 1;
            background-color: #1e1e28;
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Стили для чата */
        .chat-view {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 10px;
            font-size: 14px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: #3b82f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .msg-content {
            display: flex;
            flex-direction: column;
        }

        .msg-author {
            color: #fff;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .msg-text {
            color: #ccc;
        }

        .msg-time {
            font-size: 10px;
            color: #666;
            margin-top: 3px;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            gap: 10px;
            border-top: 1px solid #333;
            background-color: #1e1e28;
        }

        .chat-input-area input {
            flex: 1;
            background-color: #14141c;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 10px 15px;
            color: #fff;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: #7c3aed;
        }

        .send-btn {
            background-color: #7c3aed;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* Стили для вида "Меню" (скрытый по умолчанию) */
        .menu-view {
            display: none;
            padding: 20px;
            flex-direction: column;
            gap: 15px;
            height: 100%;
            overflow-y: auto;
        }

        .menu-view h3 {
            margin-bottom: 10px;
            color: #fff;
        }

        .menu-item {
            padding: 15px;
            background-color: #2a2a35;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .menu-item:hover {
            background-color: #3b3b4a;
        }

        /* =========================================
           АДАПТИВНОСТЬ (Для телефонов)
           ========================================= */
        @media (max-width: 768px) {
            body {
                overflow-y: auto; /* Разрешаем скролл на мобильных */
            }
            .main-content {
                flex-direction: column; /* Плеер сверху, чат снизу */
                height: auto;
            }
            .top-bar {
                width: 100%;
            }
            .pro-profile, .sidebar-section {
                width: 100%;
                max-width: none;
            }
            .video-section {
                min-height: 250px; /* Фиксированная высота плеера на мобилках */
            }
            .content-window {
                min-height: 400px;
            }
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <header class="top-bar">
        <div class="pro-profile">
            <span>Про</span>
            <span style="color: #888; font-size: 12px;">10дн</span>
            <div class="status-dot"></div>
            <span>2</span>
            <button class="settings-btn">⚙️</button>
        </div>
    </header>

    <!-- ОСНОВНАЯ ОБЛАСТЬ -->
    <main class="main-content">
        
        <!-- ЛЕВАЯ ЧАСТЬ: ПЛЕЕР -->
        <section class="video-section">
            <div class="video-placeholder">
                <div class="icon">📺</div>
                <h2>Тут будет видео</h2>
                <p>Хост ещё не выбрал</p>
            </div>
        </section>

        <!-- ПРАВАЯ ЧАСТЬ: КНОПКИ И ЧАТ -->
        <aside class="sidebar-section">
            
            <!-- Кнопки меню (строго над окном контента) -->
            <div class="nav-buttons">
                <button class="nav-btn active" onclick="switchTab('home', this)">Главная</button>
                <button class="nav-btn" onclick="switchTab('general', this)">Общее</button>
                <button class="nav-btn" onclick="switchTab('custom', this)">Своё</button>
                <button class="nav-btn" onclick="switchTab('people', this)">Люди</button>
                <button class="nav-btn" onclick="switchTab('invite', this)">Пригласить</button>
                <!-- ИЗМЕНЕНО: Иконка заменена на текст "Меню" -->
                <button class="nav-btn" id="menu-btn" onclick="toggleMenu(this)">Меню</button>
            </div>

            <!-- Окно контента -->
            <div class="content-window">
                
                <!-- ВКЛАДКА: ЧАТ (Показывается по умолчанию) -->
                <div class="chat-view" id="chat-view">
                    <div class="chat-messages">
                        <div class="message">
                            <div class="avatar">АК</div>
                            <div class="msg-content">
                                <span class="msg-author">ак</span>
                                <span class="msg-text">Просто</span>
                                <span class="msg-time">20:29</span>
                            </div>
                        </div>
                        <!-- Пример сообщения -->
                        <div class="message">
                            <div class="avatar" style="background:#e11d48">Ив</div>
                            <div class="msg-content">
                                <span class="msg-author">Иван</span>
                                <span class="msg-text">Привет всем! Когда стрим?</span>
                                <span class="msg-time">20:31</span>
                            </div>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" placeholder="Сообщение...">
                        <button class="send-btn">➤</button>
                    </div>
                </div>

                <!-- ВКЛАДКА: МЕНЮ (Скрыта по умолчанию) -->
                <div class="menu-view" id="menu-view">
                    <h3>Настройки и меню</h3>
                    <div class="menu-item">⚙️ Настройки профиля</div>
                    <div class="menu-item">🔔 Уведомления</div>
                    <div class="menu-item">🎨 Оформление</div>
                    <div class="menu-item">❓ Помощь</div>
                </div>

            </div>
        </aside>
    </main>

    <!-- СКРИПТ ДЛЯ ПЕРЕКЛЮЧЕНИЯ ВКЛАДОК -->
    <script>
        // Получаем элементы
        const chatView = document.getElementById('chat-view');
        const menuView = document.getElementById('menu-view');
        const menuBtn = document.getElementById('menu-btn');
        const navButtons = document.querySelectorAll('.nav-btn');

        // Функция переключения на чат (и другие вкладки)
        function switchTab(tabName, btnElement) {
            // 1. Убираем класс active у всех кнопок
            navButtons.forEach(btn => btn.classList.remove('active'));
            
            // 2. Добавляем класс active нажатой кнопке
            btnElement.classList.add('active');

            // 3. Показываем чат (в реальном приложении тут будет загрузка контента для 'general', 'people' и т.д.)
            chatView.style.display = 'flex';
            menuView.style.display = 'none';
            
            // Опционально: можно менять заголовок чата или загружать разные данные
            console.log(`Переключено на вкладку: ${tabName}`);
        }

        // Функция переключения на "Меню"
        function toggleMenu(btnElement) {
            // 1. Снимаем active со всех кнопок
            navButtons.forEach(btn => btn.classList.remove('active'));
            
            // 2. Активируем кнопку "Меню"
            btnElement.classList.add('active');

            // 3. Скрываем чат, показываем меню
            chatView.style.display = 'none';
            menuView.style.display = 'flex';
        }
    </script>
</body>
</html>
