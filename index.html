  .toast-root {

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function toast(msg, type){
  const r = document.getElementById('toastRoot');
  if(!r) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  r.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity .3s';
    setTimeout(() => el.remove(), 300);
  }, 3000);
}
function openSheet(html){
  document.getElementById('modalRoot').innerHTML =
    '<div class="sheet-overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet">' + html + '</div></div>';
}
function closeSheet(){ document.getElementById('modalRoot').innerHTML = ''; }
function encodePass(p){ return btoa(unescape(encodeURIComponent(p))); }
function getDaysLeft(exp){
  if(!exp) return null;
  const d = new Date(exp) - new Date();
  return Math.max(0, Math.ceil(d / 86400000));
}
function getGreeting(){
  const h = new Date().getHours();

  });

  return online.length + (hasSelf ? 0 : 1);
}

}
function getPersonalVideo(){
  const k = personalVideoKey();
  return k ? localStorage.getItem(k) : null;
}
function setPersonalVideo(url){
  const k = personalVideoKey();
  if(!k) return;
  if(url) localStorage.setItem(k, url);
  else localStorage.removeItem(k);
}

function openPersonalVideoSheet(){

function savePersonalVideo(){
  const url = document.getElementById('personalVideoUrl').value.trim();
  if(!url) return toast('Вставь ссылку', 'error');
  if(!url.match(/^https?:\/\//i)) return toast('Ссылка должна начинаться с http://', 'error');
  if(!parseVideoUrl(url)) return toast('Не получилось распознать', 'error');
  setPersonalVideo(url);
  closeSheet();
  renderPersonalVideo();
  refreshTabButtons();
  toast('Своё видео сохранено', 'success');
}

function removePersonalVideo(){
  setPersonalVideo(null);
  closeSheet();
  renderPersonalVideo();
  refreshTabButtons();
  toast('Своё видео убрано');
}

function renderPersonalVideo(){
  const box = document.getElementById('personalVideoBox');
  if(!box) return;
  const url = getPersonalVideo();
  if(!url){
    box.innerHTML = '<div class="video-placeholder" style="padding:16px;font-size:12px;">' +
      'Нажми «🫈 Своё» внизу,<br>чтобы добавить видео для себя' +
    '</div>';
    return;
  }
  const vd = parseVideoUrl(url);
  if(!vd){ box.innerHTML = '<div class="video-placeholder">Не удалось распознать</div>'; return; }
  let vh = '';
  if(vd.type === 'invidious'){
    vh = '<iframe src="' + esc(vd.src) + '" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
  } else if(vd.type === 'html5'){
    vh = '<video src="' + esc(vd.src) + '" controls></video>';
  } else if(vd.type === 'hls'){
    vh = '<video id="personalHlsPlayer" controls></video>';
    setTimeout(() => {
      const v = document.getElementById('personalHlsPlayer');
      if(!v) return;
      if(window.Hls && window.Hls.isSupported()){
        const h = new window.Hls();
        h.loadSource(url);
        h.attachMedia(v);
      } else if(v.canPlayType('application/vnd.apple.mpegurl')){
        v.src = url;
      }
    }, 50);
  } else if(vd.embeddable){
    vh = '<iframe src="' + esc(vd.src) + '" allow="encrypted-media; fullscreen" allowfullscreen></iframe>';
  } else {
    vh = '<a href="' + esc(url) + '" target="_blank" rel="noopener" class="btn primary" style="text-decoration:none;">Открыть</a>';
  }
  box.innerHTML = vh;
}

async function loadRooms(){
  try {
    const {data, error} = await sb.from('rooms').select('*')
      .gt('expires_at', new Date().toISOString())
      .order('created_at', {ascending:false});
    if(error){ console.error(error); return; }
    rooms = (data || []).filter(r => !r.is_hidden || r.host_id === myId);
    renderRooms();
  } catch(e){ console.error(e); }
}
function scheduleRoomsReload(){
  if(roomsRefreshTimer) return;
  roomsRefreshTimer = setTimeout(() => { roomsRefreshTimer = null; loadRooms(); }, 1500);
}
function renderRooms(){
  const area = document.getElementById('roomsArea');
  const empty = document.getElementById('emptyState');
  if(!area) return;
  if(rooms.length === 0){
    area.innerHTML = '';
    if(empty) empty.style.display = 'block';
    return;
  }
  if(empty) empty.style.display = 'none';
  area.innerHTML = rooms.map(r => {
    const days = getDaysLeft(r.expires_at);
    const warn = (days !== null && days <= 2)
      ? '<div class="room-card-badge">' + days + ' дн.</div>' : '';
    const lock = r.password_hash
      ? '<div class="room-card-badge" style="background:var(--danger);top:auto;bottom:10px;right:10px;">🔒</div>' : '';
    return '<div class="room-card" onclick="enterRoom(\'' + esc(r.id) + '\')">' +
      warn + lock +
      '<div class="room-card-avatar" style="background:' + esc(r.color || '#6f52e8') + ';">' +
        (r.avatar || '🎬') +
      '</div>' +
      '<div class="room-card-name">' + esc(r.name) + '</div>' +
    '</div>';
  }).join('');
}

async function generateRoomName(base){
  const b = base.trim();
  if(!b) return '';
  try {
    const {data} = await sb.from('rooms').select('name').ilike('name', b + '%');
    if(!data || data.length === 0) return b;
    let max = 0;
    data.forEach(r => {
      if(r.name === b) max = Math.max(max, 1);
      else {
        const m = r.name.match(new RegExp('^' + b.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ' (\\d+)$'));
        if(m) max = Math.max(max, parseInt(m[1]));
      }
    });
    return max === 0 ? b : b + ' ' + (max + 1);
  } catch(e){ return b; }
}
async function createRoom(){
  const name = document.getElementById('roomName').value.trim();
  if(!name) return toast('Введи название', 'error');
  if(name.length > 20) return toast('Слишком длинное', 'error');
  const type = document.getElementById('roomType').value;
  const isHidden = type === 'hidden';
  const isPassword = type === 'password';
  const inviteCode = isHidden ? ('inv_' + Math.random().toString(36).slice(2,12)) : null;
  let passwordHash = null;
  if(isPassword){
    const pass = (document.getElementById('roomPassword').value || '').trim();
    if(!pass) return toast('Введи пароль', 'error');
    if(pass.length < 3) return toast('Пароль слишком короткий', 'error');
    passwordHash = encodePass(pass);
  }
  const finalName = await generateRoomName(name);
  const roomId = 'room_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const exp = new Date(); exp.setDate(exp.getDate() + 10);
  const {error} = await sb.from('rooms').insert({
    id: roomId, name: finalName, avatar: selectedAvatar, color: selectedColor,
    host_id: myId, video_url: null, sync_state: {},
    expires_at: exp.toISOString(),
    is_hidden: isHidden, invite_code: inviteCode, password_hash: passwordHash
  });
  if(error){ toast('Ошибка: ' + error.message, 'error'); return; }
  closeSheet();
  toast('Комната «' + finalName + '» создана', 'success');
  await loadRooms();
  setTimeout(() => enterRoom(roomId), 300);
}

async function enterRoom(roomId){
  let room = rooms.find(r => r.id === roomId);
  if(!room){
    const {data, error} = await sb.from('rooms').select('*').eq('id', roomId).limit(1);
    if(error || !data || data.length === 0) return toast('Комната не найдена', 'error');
    room = data[0];
    if(!rooms.find(r => r.id === roomId)) rooms.push(room);
  }
  if(room.expires_at && new Date(room.expires_at) < new Date())
    return toast('Комната удалена (срок истёк)', 'error');

  if(room.is_hidden && room.host_id !== myId){
    const params = new URLSearchParams(window.location.search);
    const urlInvite = params.get('invite');
    const savedInvite = sessionStorage.getItem('room_invite_' + roomId);
    const savedOk = (urlInvite === room.invite_code) || (savedInvite === room.invite_code);
    if(!savedOk) return toast('Скрытая комната. Открой по ссылке от хоста.', 'error');
    sessionStorage.setItem('room_invite_' + roomId, room.invite_code);
  }
  if(room.password_hash && room.host_id !== myId){
    const savedPass = sessionStorage.getItem('room_pass_' + roomId);
    const okPass = savedPass === room.password_hash;
    if(!okPass){
      const entered = prompt('Комната с паролем. Введи пароль:');
      if(!entered) return;
      const hash = encodePass(entered);
      if(hash !== room.password_hash) return toast('Неверный пароль', 'error');
      sessionStorage.setItem('room_pass_' + roomId, hash);
    }
  }

  currentRoom = room;
  isHost = (room.host_id === myId);
  localStorage.setItem(LS.lastRoom, roomId);

  showScreen('room');
  renderRoomShell();

  await loadRoomMessages(roomId);
  await loadPresence();
  await upsertPresence();
  await loadPresence();
  renderRoomHeaderMeta();
  updateDMBadge();

  await teardownChannels();
  subscribeToRoom(roomId);

  if(room.countdown_start){
    const d = Math.ceil((new Date(room.countdown_start).getTime() - Date.now()) / 1000);
    if(d > 0) startCountdown();
  }
  maybeStartAutoSwitch();
}

async function teardownChannels(){
  try {
    if(roomChannel){ await sb.removeChannel(roomChannel); roomChannel = null; }
    if(dmChannel){ await sb.removeChannel(dmChannel); dmChannel = null; }
    if(presenceChannel){ await sb.removeChannel(presenceChannel); presenceChannel = null; }
  } catch(e){ console.warn('teardown', e); }
}

function leaveRoom(){
  if(roomChannel){ sb.removeChannel(roomChannel); roomChannel = null; }
  if(dmChannel){ sb.removeChannel(dmChannel); dmChannel = null; }
  if(presenceChannel){ sb.removeChannel(presenceChannel); presenceChannel = null; }
  if(countdownInterval){ clearInterval(countdownInterval); countdownInterval = null; }
  currentRoom = null;
  currentRoomMessages = [];
  currentPresence = [];
  localStorage.removeItem(LS.lastRoom);
  showScreen('home');
  loadRooms();
}

async function restoreLastRoom(){
  const lastRoom = localStorage.getItem(LS.lastRoom);
  if(!lastRoom) return false;
  const {data} = await sb.from('rooms').select('id')
    .eq('id', lastRoom)
    .gt('expires_at', new Date().toISOString())
    .limit(1);
  if(data && data.length){ enterRoom(lastRoom); return true; }
  localStorage.removeItem(LS.lastRoom);
  return false;
}

// ============================================================
// REALTIME
// ============================================================
function subscribeToRoom(roomId){
  roomChannel = sb.channel('room-' + roomId)
    .on('postgres_changes',
      {event:'INSERT', schema:'public', table:'room_messages', filter:'room_id=eq.' + roomId},
      payload => appendMessage(payload.new))
    .on('postgres_changes',
      {event:'UPDATE', schema:'public', table:'room_messages', filter:'room_id=eq.' + roomId},
      () => loadRoomMessages(roomId))
    .on('postgres_changes',
      {event:'UPDATE', schema:'public', table:'rooms', filter:'id=eq.' + roomId},
      p => {
        if(!currentRoom || currentRoom.id !== roomId) return;
        const oldVideo = currentRoom.video_url;
        const oldCountdown = currentRoom.countdown_start;
        currentRoom = p.new;
        if(oldVideo !== p.new.video_url){
          renderVideoOnly();
          renderRoomHeaderMeta();
          autoSwitchDone = false;
          manualServerChoice = false;
          autoSwitchAttempts = 0;
          maybeStartAutoSwitch();
        }
        if(oldCountdown !== p.new.countdown_start && p.new.countdown_start){
          startCountdown();
        }
      })
    .on('postgres_changes',
      {event:'DELETE', schema:'public', table:'rooms', filter:'id=eq.' + roomId},
      () => { toast('Комната удалена', 'error'); leaveRoom(); })
    .subscribe();

  dmChannel = sb.channel('dm-' + myId)
    .on('postgres_changes',
      {event:'INSERT', schema:'public', table:'direct_messages', filter:'to_user_id=eq.' + myId},
      p => {
        if(p.new.room_id !== currentRoom?.id) return;
        toast('Сообщение от ' + (p.new.from_name || 'гостя'), 'success');
        updateDMBadge();
        const dmPeer = document.getElementById('dmPeerId');
        if(dmPeer && dmPeer.value === p.new.from_user_id){
          openDM(p.new.from_user_id, p.new.from_name);
        }
      })
    .subscribe();

  presenceChannel = sb.channel('presence-' + roomId)
    .on('postgres_changes',
      {event:'*', schema:'public', table:'room_presence', filter:'room_id=eq.' + roomId},
      () => scheduleLoadPresence())
    .subscribe();
}
function scheduleLoadPresence(){
  if(presenceTimer) return;
  presenceTimer = setTimeout(() => {
    presenceTimer = null;
    loadPresence().then(() => renderRoomHeaderMeta());
  }, 800);
  }

<style>
:root {
  --bg:#101018; --surface:#191924; --surface-2:#21212e;
  --border:#2a2a38; --text:#ebeaf2; --text-2:#a8a8b8; --text-3:#6e6e82;
  --accent:#6f52e8; --accent-2:#8b72f0;
  --danger:#e05563; --success:#4a9e6e;
  --radius:12px; --radius-lg:16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; width:100%; }
body {
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
  overflow-x:hidden; min-height:100vh; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; font-size:inherit; }
input, textarea, select { font-family:inherit; font-size:16px; }
.wrap { max-width:520px; margin:0 auto; padding:0 12px; }

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:12px 16px; border-radius:var(--radius); font-size:14px; font-weight:700;
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  min-height:46px; text-align:center; transition:transform .1s, opacity .15s;
}
.btn:active { transform:scale(0.98); opacity:0.9; }
.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.ghost { background:transparent; }
.btn.danger { background:var(--danger); color:#fff; border-color:var(--danger); }
.btn.block { width:100%; margin-top:6px; }
.btn.small { padding:8px 12px; min-height:36px; font-size:12px; }
.btn.big { min-height:56px; font-size:15px; font-weight:800; border-radius:var(--radius-lg); }
.btn:disabled { opacity:0.5; cursor:not-allowed; }

.input, .select {
  width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
  padding:12px 14px; border-radius:var(--radius); font-size:16px; margin-bottom:8px;
}
.input:focus, .select:focus { outline:none; border-color:var(--accent); }
.select { appearance:none; -webkit-appearance:none; }

.field-label {
  display:block; font-size:11px; color:var(--text-3); text-transform:uppercase;
  letter-spacing:1px; font-weight:700; margin-bottom:5px; margin-top:12px;
  }
  .toast-root {
  position:fixed; left:0; right:0; bottom:calc(120px + var(--safe-bottom));
  z-index:200; display:flex; flex-direction:column; align-items:center;
  gap:6px; pointer-events:none; padding:0 12px;
}
.toast {
  background:var(--surface-2); color:var(--text); padding:10px 16px;
  border-radius:20px; font-size:13px; font-weight:600; max-width:100%;
  border:1px solid var(--border); animation:toastIn .25s; text-align:center;
}
.toast.error { background:var(--danger); color:#fff; }
.toast.success { background:var(--success); color:#fff; }
@keyframes toastIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

.sheet-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
  animation:fadeIn .2s;
}
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
.sheet {
  background:var(--surface); width:100%; max-width:520px;
  border-radius:20px 20px 0 0; border-top:1px solid var(--border);
  padding:16px 16px calc(20px + var(--safe-bottom));
  max-height:90vh; overflow-y:auto; animation:slideUp .25s;
}
@keyframes slideUp { from{transform:translateY(100%);} to{transform:translateY(0);} }
.sheet::before {
  content:''; display:block; width:44px; height:4px; background:var(--border);
  border-radius:2px; margin:0 auto 14px;
}
.sheet h2 { font-size:17px; font-weight:800; margin-bottom:4px; }
.sheet .sub { font-size:13px; color:var(--text-2); margin-bottom:14px; }

.hidden-note { font-size:12px; color:var(--text-3); font-style:italic; padding:12px; text-align:center; }
.empty-state { text-align:center; padding:40px 20px; color:var(--text-2); }
.empty-state .big-icon { font-size:44px; margin-bottom:10px; opacity:0.5; }
.empty-state h2 { font-size:15px; margin-bottom:6px; font-weight:700; }
.empty-state p { font-size:12px; }

.screen { display:none; padding:0; }
.screen.active { display:block; }

.app-header {
  position:sticky; top:0; z-index:50;
  background:rgba(16,16,24,0.95);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.app-header .wrap {
  display:flex; align-items:center; justify-content:space-between; padding:12px;
}
.logo { font-size:16px; font-weight:800; cursor:pointer; }

.room-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:14px; cursor:pointer;
  display:flex; flex-direction:column; gap:8px; position:relative;
  transition:transform .1s; min-height:110px;
}
.room-card:active { transform:scale(0.97); }
.room-card-avatar {
  width:52px; height:52px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:26px; border:2px solid var(--border);
}
.room-card-name {
  font-size:14px; font-weight:800; line-height:1.2;
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}
.room-card-badge {
  position:absolute; top:10px; right:10px;
  font-size:10px; font-weight:700; background:var(--accent);
  border-radius:8px; padding:2px 7px; color:#fff;
  }
  .chat-msg {
  padding:8px 0; border-bottom:1px solid var(--border);
  display:flex; gap:10px; align-items:flex-start;
}
.chat-msg:last-child { border-bottom:none; }
.chat-msg-avatar {
  width:32px; height:32px; border-radius:50%; border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:15px;
  flex-shrink:0; background:var(--surface-2);
}
.chat-msg-body { flex:1; min-width:0; }
.chat-msg-name { font-size:12px; font-weight:700; margin-bottom:2px; }
.chat-msg-text { font-size:14px; word-wrap:break-word; }
.chat-msg-time { font-size:10px; color:var(--text-3); margin-top:3px; }

.sheet-list { display:flex; flex-direction:column; gap:4px; margin:8px 0; }
.sheet-list .sheet-item {
  display:flex; align-items:center; gap:14px;
  padding:14px 12px; border-radius:12px; cursor:pointer;
  font-size:15px; font-weight:600; min-height:56px;
  transition:background .1s;
}
.sheet-list .sheet-item:active { background:var(--surface-2); }
.sheet-list .sheet-item .ic { font-size:20px; flex-shrink:0; width:24px; text-align:center; }
.sheet-list .sheet-item.danger { color:var(--danger); }
.sheet-list .sheet-item .badge-auto { margin-left:auto; font-size:11px; color:var(--text-3); }

.theme-switch {
  display:flex; gap:6px; padding:4px;
  border:1px solid var(--border); border-radius:14px; background:var(--surface);
}
.theme-switch button {
  flex:1; padding:10px 8px; font-size:12px; font-weight:700;
  border-radius:10px; color:var(--text-2); min-height:40px;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.theme-switch button.active { background:var(--accent); color:#fff; }

.video-placeholder {
  color:#888; text-align:center; padding:20px; font-size:13px; line-height:1.5;
}
.video-placeholder .big { font-size:15px; font-weight:700; margin-bottom:6px; color:#bbb; }

.countdown-overlay {
  display:none; position:absolute; inset:0; z-index:20;
  background:rgba(0,0,0,0.75);
  align-items:center; justify-content:center; flex-direction:column; gap:8px;
}
.countdown-num { font-size:80px; font-weight:900; color:#fff; line-height:1; }
.countdown-hint { font-size:13px; color:#ccc; }
.play-overlay {
  display:none; position:absolute; inset:0; z-index:20;
  background:rgba(0,0,0,0.6);
  align-items:center; justify-content:center; flex-direction:column; gap:8px;
  pointer-events:none;
}
.play-overlay .text { font-size:20px; font-weight:800; color:#fff; }
.play-overlay .hint { font-size:12px; color:#ccc; }

.people-row {
  display:flex; align-items:center; gap:12px;
  padding:12px; border-bottom:1px solid var(--border);
}
.people-row:last-child { border-bottom:none; }
.people-row-avatar {
  width:40px; height:40px; border-radius:50%; border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:20px;
  flex-shrink:0;
}
.people-row-name { flex:1; font-size:14px; font-weight:700; }
.people-row-status { font-size:11px; color:var(--text-3); }
.people-row .btn { flex-shrink:0; }

.dm-box { display:flex; flex-direction:column; height:55vh; min-height:300px; }
.dm-messages {
  flex:1; overflow-y:auto; padding:10px;
  background:var(--bg); border-radius:12px; margin-bottom:10px;
}
.dm-msg {
  max-width:80%; padding:10px 14px; border-radius:16px;
  margin-bottom:8px; font-size:15px; word-wrap:break-word;
}
.dm-msg.mine { background:var(--accent); color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
.dm-msg.their { background:var(--surface-2); color:var(--text); margin-right:auto; border-bottom-left-radius:4px; }
.dm-time { font-size:10px; opacity:0.6; margin-top:4px; }

.avatar-option {
  width:44px; height:44px; border-radius:50%;
  border:2px solid var(--border); background:var(--surface-2);
  font-size:22px; display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.avatar-option.selected { border-color:var(--accent); transform:scale(1.08); }
.color-option {
  width:38px; height:38px; border-radius:50%;
  border:2px solid var(--border); cursor:pointer;
}
.color-option.selected { border-color:var(--text); transform:scale(1.08); }

.video-section { display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
.video-label {
  font-size:10px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
  padding:4px 10px; border-radius:8px;
  display:inline-flex; align-items:center; gap:6px;
  align-self:flex-start;
}
.video-label-common { color:var(--text-3); background:var(--surface-2); }
.video-label-personal { color:#fff; background:var(--accent); }

  }

<body data-theme="phone">

<header class="app-header">
  <div class="wrap">
    <div class="logo" onclick="goHome()">Смотрим вместе</div>
  </div>
</header>

<main class="wrap">

async function generateRoomName(base){
  const b = base.trim();
  if(!b) return '';
  try {
    const {data} = await sb.from('rooms').select('name').ilike('name', b + '%');
    if(!data || data.length === 0) return b;
    let max = 0;
    data.forEach(r => {
      if(r.name === b) max = Math.max(max, 1);
      else {
        const m = r.name.match(new RegExp('^' + b.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ' (\\d+)$'));
        if(m) max = Math.max(max, parseInt(m[1]));
      }
    });
    return max === 0 ? b : b + ' ' + (max + 1);
  } catch(e){ return b; }
}
async function createRoom(){
  const name = document.getElementById('roomName').value.trim();
  if(!name) return toast('Введи название', 'error');
  if(name.length > 20) return toast('Слишком длинное', 'error');
  const type = document.getElementById('roomType').value;
  const isHidden = type === 'hidden';
  const isPassword = type === 'password';
  const inviteCode = isHidden ? ('inv_' + Math.random().toString(36).slice(2,12)) : null;
  let passwordHash = null;
  if(isPassword){
    const pass = (document.getElementById('roomPassword').value || '').trim();
    if(!pass) return toast('Введи пароль', 'error');
    if(pass.length < 3) return toast('Пароль слишком короткий', 'error');
    passwordHash = encodePass(pass);
  }
  const finalName = await generateRoomName(name);
  const roomId = 'room_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const exp = new Date(); exp.setDate(exp.getDate() + 10);
  const {error} = await sb.from('rooms').insert({
    id: roomId, name: finalName, avatar: selectedAvatar, color: selectedColor,
    host_id: myId, video_url: null, sync_state: {},
    expires_at: exp.toISOString(),
    is_hidden: isHidden, invite_code: inviteCode, password_hash: passwordHash
  });
  if(error){ toast('Ошибка: ' + error.message, 'error'); return; }
  closeSheet();
  toast('Комната «' + finalName + '» создана', 'success');
  await loadRooms();
  setTimeout(() => enterRoom(roomId), 300);
}

async function enterRoom(roomId){
  let room = rooms.find(r => r.id === roomId);
  if(!room){
    const {data, error} = await sb.from('rooms').select('*').eq('id', roomId).limit(1);
    if(error || !data || data.length === 0) return toast('Комната не найдена', 'error');
    room = data[0];
    if(!rooms.find(r => r.id === roomId)) rooms.push(room);
  }
  if(room.expires_at && new Date(room.expires_at) < new Date())
    return toast('Комната удалена (срок истёк)', 'error');
  if(room.is_hidden && room.host_id !== myId){
    const params = new URLSearchParams(window.location.search);
    const urlInvite = params.get('invite');
    const savedInvite = sessionStorage.getItem('room_invite_' + roomId);
    const savedOk = (urlInvite === room.invite_code) || (savedInvite === room.invite_code);
    if(!savedOk) return toast('Скрытая комната. Открой по ссылке от хоста.', 'error');
    sessionStorage.setItem('room_invite_' + roomId, room.invite_code);
  }
  if(room.password_hash && room.host_id !== myId){
    const savedPass = sessionStorage.getItem('room_pass_' + roomId);
    const okPass = savedPass === room.password_hash;
    if(!okPass){
      const entered = prompt('Комната с паролем. Введи пароль:');
      if(!entered) return;
      const hash = encodePass(entered);
      if(hash !== room.password_hash) return toast('Неверный пароль', 'error');
      sessionStorage.setItem('room_pass_' + roomId, hash);
    }
  }
  currentRoom = room;
  isHost = (room.host_id === myId);
  localStorage.setItem(LS.lastRoom, roomId);
  showScreen('room');
  renderRoomShell();
  await loadRoomMessages(roomId);
  await loadPresence();
  await upsertPresence();
  await loadPresence();
  renderRoomHeaderMeta();
  updateDMBadge();
  await teardownChannels();
  subscribeToRoom(roomId);
  if(room.countdown_start){
    const d = Math.ceil((new Date(room.countdown_start).getTime() - Date.now()) / 1000);
    if(d > 0) startCountdown();
  }
  maybeStartAutoSwitch();
}
async function teardownChannels(){
  try {
    if(roomChannel){ await sb.removeChannel(roomChannel); roomChannel = null; }
    if(dmChannel){ await sb.removeChannel(dmChannel); dmChannel = null; }
    if(presenceChannel){ await sb.removeChannel(presenceChannel); presenceChannel = null; }
  } catch(e){ console.warn('teardown', e); }
}
function leaveRoom(){
  if(roomChannel){ sb.removeChannel(roomChannel); roomChannel = null; }
  if(dmChannel){ sb.removeChannel(dmChannel); dmChannel = null; }
  if(presenceChannel){ sb.removeChannel(presenceChannel); presenceChannel = null; }
  if(countdownInterval){ clearInterval(countdownInterval); countdownInterval = null; }
  currentRoom = null;
  currentRoomMessages = [];
  currentPresence = [];
  localStorage.removeItem(LS.lastRoom);
  showScreen('home');
  loadRooms();
}
async function restoreLastRoom(){
  const lastRoom = localStorage.getItem(LS.lastRoom);
  if(!lastRoom) return false;
  const {data} = await sb.from('rooms').select('id')
    .eq('id', lastRoom)
    .gt('expires_at', new Date().toISOString())
    .limit(1);
  if(data && data.length){ enterRoom(lastRoom); return true; }
  localStorage.removeItem(LS.lastRoom);
  return false;
}

function subscribeToRoom(roomId){
  roomChannel = sb.channel('room-' + roomId)
    .on('postgres_changes',
      {event:'INSERT', schema:'public', table:'room_messages', filter:'room_id=eq.' + roomId},
      payload => appendMessage(payload.new))
    .on('postgres_changes',
      {event:'UPDATE', schema:'public', table:'room_messages', filter:'room_id=eq.' + roomId},
      () => loadRoomMessages(roomId))
    .on('postgres_changes',
      {event:'UPDATE', schema:'public', table:'rooms', filter:'id=eq.' + roomId},
      p => {
        if(!currentRoom || currentRoom.id !== roomId) return;
        const oldVideo = currentRoom.video_url;
        const oldCountdown = currentRoom.countdown_start;
        currentRoom = p.new;
        if(oldVideo !== p.new.video_url){
          renderVideoOnly();
          renderRoomHeaderMeta();
          autoSwitchDone = false;
          manualServerChoice = false;
          autoSwitchAttempts = 0;
          maybeStartAutoSwitch();
        }
        if(oldCountdown !== p.new.countdown_start && p.new.countdown_start){
          startCountdown();
        }
      })
    .on('postgres_changes',
      {event:'DELETE', schema:'public', table:'rooms', filter:'id=eq.' + roomId},
      () => { toast('Комната удалена', 'error'); leaveRoom(); })
    .subscribe();
  dmChannel = sb.channel('dm-' + myId)
    .on('postgres_changes',
      {event:'INSERT', schema:'public', table:'direct_messages', filter:'to_user_id=eq.' + myId},
      p => {
        if(p.new.room_id !== currentRoom?.id) return;
        toast('Сообщение от ' + (p.new.from_name || 'гостя'), 'success');
        updateDMBadge();
        const dmPeer = document.getElementById('dmPeerId');
        if(dmPeer && dmPeer.value === p.new.from_user_id){
          openDM(p.new.from_user_id, p.new.from_name);
        }
      })
    .subscribe();
  presenceChannel = sb.channel('presence-' + roomId)
    .on('postgres_changes',
      {event:'*', schema:'public', table:'room_presence', filter:'room_id=eq.' + roomId},
      () => scheduleLoadPresence())
    .subscribe();
}
function scheduleLoadPresence(){
  if(presenceTimer) return;
  presenceTimer = setTimeout(() => {
    presenceTimer = null;
    loadPresence().then(() => renderRoomHeaderMeta());
  }, 800);

  const onlineCount = countOnline();
  const isTablet = theme === 'tablet';

  const header =

function parseVideoUrl(url){
  if(!url) return null;
  url = url.trim();
  if(!url.match(/^https?:\/\//i)) return null;
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(yt) return {type:'invidious', videoId:yt[1], src:currentInvidious + '/embed/' + yt[1], embeddable:true};
  const rt = url.match(/rutube\.ru\/(?:video|play\/embed|live)\/([a-zA-Z0-9]+)/);
  if(rt) return {type:'iframe', src:'https://rutube.ru/play/embed/' + rt[1], embeddable:true};
  const vk = url.match(/(?:vk\.com|vkvideo\.ru)\/video(-?\d+)_(\d+)/);
  if(vk) return {type:'iframe', src:'https://vk.com/video_ext.php?oid=' + vk[1] + '&id=' + vk[2] + '&autoplay=0', embeddable:true};
  const dm = url.match(/dailymotion\.com\/video\/([a-zA-Z0-9]+)/);
  if(dm) return {type:'iframe', src:'https://www.dailymotion.com/embed/video/' + dm[1], embeddable:true};
  const vm = url.match(/vimeo\.com\/(\d+)/);
  if(vm) return {type:'iframe', src:'https://player.vimeo.com/video/' + vm[1], embeddable:true};
  const tw = url.match(/twitch\.tv\/([a-zA-Z0-9_]+)$/);
  if(tw) return {type:'iframe', src:'https://player.twitch.tv/?channel=' + tw[1] + '&parent=' + window.location.hostname, embeddable:true};
  const ok = url.match(/ok\.ru\/video\/(\d+)/);
  if(ok) return {type:'iframe', src:'https://ok.ru/videoembed/' + ok[1], embeddable:true};
  const tg = url.match(/t\.me\/([a-zA-Z0-9_]+)\/(\d+)/);
  if(tg) return {type:'iframe', src:'https://t.me/' + tg[1] + '/' + tg[2] + '?embed=1', embeddable:true};
  if(url.match(/\.(mp4|webm|ogg|mov|m4v)(\?|$)/i)) return {type:'html5', src:url, embeddable:true};
  if(url.match(/\.m3u8(\?|$)/i)) return {type:'hls', src:url, embeddable:true};
  return {type:'iframe', src:url, embeddable:false};
}

async function checkInvidious(url){
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 2500);
    const r = await fetch(url + '/api/v1/stats', {signal: ctrl.signal});
    clearTimeout(t);
    if(!r.ok) return false;
    const data = await r.json();
    return data && (data.version || data.software);
  } catch(e){ return false; }
}
async function findWorkingInvidious(){
  const saved = localStorage.getItem(LS.invidious);
  if(saved && await checkInvidious(saved)){ currentInvidious = saved; return saved; }
  for(const url of INVIDIOUS_INSTANCES){
    if(await checkInvidious(url)){ currentInvidious = url; localStorage.setItem(LS.invidious, url); return url; }
  }
  return null;
}
function maybeStartAutoSwitch(){
  if(autoSwitchDone || manualServerChoice) return;
  if(!currentRoom || !currentRoom.video_url) return;
  const vd = parseVideoUrl(currentRoom.video_url);
  if(!vd || vd.type !== 'invidious') return;
  setTimeout(async () => {
    if(!currentRoom || manualServerChoice || autoSwitchDone) return;
    const frame = document.getElementById('videoPlayer');
    if(!frame || frame.tagName !== 'IFRAME') return;
    if(autoSwitchAttempts >= 3){ autoSwitchDone = true; switchToYouTubeFallback(); return; }
    autoSwitchAttempts++;
    const idx = INVIDIOUS_INSTANCES.indexOf(currentInvidious);
    const next = INVIDIOUS_INSTANCES[(idx + 1) % INVIDIOUS_INSTANCES.length];
    const ok = await checkInvidious(next);
    if(ok){
      currentInvidious = next;
      localStorage.setItem(LS.invidious, next);
      toast('Переключаю сервер: ' + new URL(next).hostname);
      renderVideoOnly();
      maybeStartAutoSwitch();
    } else {
      maybeStartAutoSwitch();
    }
  }, 10000);
}
function switchToYouTubeFallback(){
  if(!currentRoom || !currentRoom.video_url) return;
  const yt = currentRoom.video_url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(!yt) return;
  const url = 'https://www.youtube.com/embed/' + yt[1] + '?autoplay=0';
  const box = document.getElementById('videoBox');
  if(box){
    const countdownHtml = '<div id="countdownOverlay" class="countdown-overlay">' +
      '<div class="countdown-num" id="countdownNum"></div>' +
      '<div class="countdown-hint">Приготовься смотреть</div></div>';
    const playHtml = '<div id="playOverlay" class="play-overlay">' +
      '<div class="text">Нажми Play</div>' +

    toast('Invidious недоступен — включён обычный YouTube');
  }

let msgTouchTimer = null, msgTouchStartX = 0;
function startMsgTouch(e, id, userId, name){
  const t = e.touches[0];
  msgTouchStartX = t.clientX;
  msgTouchTimer = setTimeout(() => { msgTouchTimer = null; openMsgActions(id, userId, name); }, 500);
}
function endMsgTouch(e){
  if(msgTouchTimer){ clearTimeout(msgTouchTimer); msgTouchTimer = null; }
  if(!e.changedTouches) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - msgTouchStartX;
  if(dx < -40){
    const el = e.target.closest('.chat-msg');
    if(el){
      const id = el.dataset.id;
      const nameEl = el.querySelector('.chat-msg-name');
      openMsgActions(id, '', nameEl ? nameEl.textContent : '');
    }
  }
}
function openMsgActions(id, userId, name){
  if(!userId) return;
  const isMine = userId === myId;

        '<div class="sheet-item" onclick="closeSheet();openDM(\'' + esc(userId) + '\',\'' + esc(name) + '\')">' +
          '<span class="ic">✉️</span> Написать личное' +

        '<div class="sheet-item danger" onclick="closeSheet();hideMessage(' + id + ')">' +
          '<span class="ic">🙈</span> Скрыть (3 голоса — у всех)' +
        '</div>') +
      '<div class="sheet-item" onclick="closeSheet()"><span class="ic">✖️</span> Отмена</div>' +
    '</div>'
  );
}

  const {data} = await sb.from('direct_messages').select('*')
    .eq('room_id', currentRoom.id)
    .or('and(from_user_id.eq.' + myId + ',to_user_id.eq.' + userId + '),and(from_user_id.eq.' + userId + ',to_user_id.eq.' + myId + ')')
    .order('created_at', {ascending:true});
  const html = (data || []).map(m => {
    const mine = m.from_user_id === myId;
    return '<div class="dm-msg ' + (mine ? 'mine' : 'their') + '">' +
      esc(m.text) +
      '<div class="dm-time">' + new Date(m.created_at).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) + '</div>' +
    '</div>';
  }).join('');
  openSheet(
    '<h2>Личные с ' + esc(userName) + '</h2>' +
    '<input type="hidden" id="dmPeerId" value="' + esc(userId) + '">' +
    '<div class="dm-box">' +
      '<div class="dm-messages" id="dmMessages">' + (html || '<div class="hidden-note">Начни переписку</div>') + '</div>' +
      '<div class="chat-input-row">' +
        '<input id="dmInput" class="input" placeholder="Сообщение..." maxlength="500">' +
        '<button class="btn primary" onclick="sendDM(\'' + esc(userId) + '\',\'' + esc(userName) + '\')">Отправить</button>' +
      '</div>' +
    '</div>' +
    '<button class="btn ghost block" onclick="closeSheet()">Закрыть</button>'
  );
  setTimeout(() => {
    const b = document.getElementById('dmMessages');
    if(b) b.scrollTop = b.scrollHeight;
    const i = document.getElementById('dmInput');
    if(i) i.addEventListener('keydown', e => { if(e.key === 'Enter') sendDM(userId, userName); });
  }, 100);
  updateDMBadge();
}
async function sendDM(userId, userName){
  const inp = document.getElementById('dmInput');
  if(!inp) return;
  const text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  const name = localStorage.getItem(LS.myName) || 'Гость';
  await sb.from('direct_messages').insert({
    room_id: currentRoom.id, from_user_id: myId, to_user_id: userId,
    from_name: name, to_name: userName, text: text
  });
  openDM(userId, userName);
}
async function updateDMBadge(){
  if(!currentRoom) return;
  const {data} = await sb.from('direct_messages')
    .select('from_user_id, created_at')
    .eq('room_id', currentRoom.id).eq('to_user_id', myId);
  if(!data || data.length === 0){ setBadge(0); return; }
  const {data: reads} = await sb.from('dm_reads')
    .select('*').eq('room_id', currentRoom.id).eq('user_id', myId);
  const readMap = {};
  (reads || []).forEach(r => { readMap[r.peer_id] = new Date(r.last_read_at).getTime(); });
  let unread = 0;
  data.forEach(m => {
    const last = readMap[m.from_user_id] || 0;
    if(new Date(m.created_at).getTime() > last) unread++;
  });
  setBadge(unread);
}
function setBadge(n){
  const b = document.getElementById('dmBadge');
  if(!b) return;
  b.textContent = n > 0 ? String(n) : '';
  b.className = n > 0 ? 'badge' : '';
}

// ============================================================
// УПРАВЛЕНИЕ КОМНАТОЙ
// ============================================================
function openActionsSheet(){
  if(!currentRoom) return;
  const r = currentRoom;
  const days = getDaysLeft(r.expires_at);
  const canExtendNow = isHost && days !== null && days <= 2 &&
    (!r.extended_at || (Date.now() - new Date(r.extended_at).getTime()) > 8 * 86400000);
  const isTablet = theme === 'tablet';
  const hasPersonal = !!getPersonalVideo();
  openSheet(
    '<h2>⚙️ Управление</h2>' +
    '<div class="sheet-list">' +
      '<div class="sheet-item" onclick="closeSheet();openVideoSheet()">' +
        '<span class="ic">🎬</span> ' + (r.video_url ? 'Заменить общее видео' : 'Выбрать общее видео') +
      '</div>' +
      (isTablet
        ? '<div class="sheet-item" onclick="closeSheet();openPersonalVideoSheet()">' +
            '<span class="ic">🫈</span> ' + (hasPersonal ? 'Заменить своё видео' : 'Своё видео (только для тебя)') +
          '</div>'
        : '') +
      (canExtendNow
        ? '<div class="sheet-item" onclick="closeSheet();extendRoom()">' +
            '<span class="ic">📅</span> Продлить на 10 дней' +
            '<span class="badge-auto">осталось ' + days + ' дн.</span>' +
          '</div>'
        : '') +
      (isHost
        ? '<div class="sheet-item danger" onclick="closeSheet();deleteRoom()">' +
            '<span class="ic">🗑️</span> Удалить комнату' +
          '</div>'
        : '') +
      '<div class="sheet-item" onclick="closeSheet();leaveRoom()">' +
        '<span class="ic">🚪</span> Выйти из комнаты' +
      '</div>' +
    '</div>'
  );
}
async function extendRoom(){
  if(!currentRoom || !isHost) return;
  const ne = new Date(); ne.setDate(ne.getDate() + 10);
  const {error} = await sb.from('rooms').update({
    expires_at: ne.toISOString(),
    extended_at: new Date().toISOString()
  }).eq('id', currentRoom.id);
  if(error){ toast('Ошибка: ' + error.message, 'error'); return; }
  currentRoom.expires_at = ne.toISOString();
  currentRoom.extended_at = new Date().toISOString();
  toast('Продлено на 10 дней', 'success');
  renderRoomHeaderMeta();
  loadRooms();
}
async function deleteRoom(){
  if(!currentRoom || !isHost) return;
  if(!confirm('Удалить комнату «' + currentRoom.name + '»? Всё удалится.')) return;
  await sb.from('rooms').delete().eq('id', currentRoom.id);
  toast('Комната удалена', 'success');
  leaveRoom();
}

// ============================================================
// HEARTBEAT
// ============================================================
function startHeartbeat(){
  if(heartbeatInterval) clearInterval(heartbeatInterval);
  heartbeatInterval = setInterval(() => { if(currentRoom) upsertPresence(); }, 30000);
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
(async function init(){
  initTheme();
  const g = document.getElementById('greeting');
  if(g) g.textContent = getGreeting();
  cleanupRooms();
  findWorkingInvidious();
  await loadRooms();
  sb.channel('rooms-list')
    .on('postgres_changes', {event:'*', schema:'public', table:'rooms'}, () => scheduleRoomsReload())
    .subscribe();
  startHeartbeat();
  const params = new URLSearchParams(window.location.search);
  const roomParam = params.get('room');
  if(roomParam) enterRoom(roomParam);
  else restoreLastRoom();
})();
</script>
